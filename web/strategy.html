<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Race Strategy</title>
<meta name="description" content="Live IMSA race strategy for the Corvettes: energy, stops, fill times, lap time and gap trends.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23eda100'/><text x='16' y='23' font-size='18' font-family='Arial' font-weight='700' text-anchor='middle' fill='%23111'>4</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header>
    <div>
      <h1>Yellow Car <span>Points</span></h1>
      <p class="sub" id="sub">Race strategy</p>
      <nav class="tabs"><a id="to-standings" href="./">Standings</a><a href="strategy.html" aria-current="page">Strategy</a><a href="about.html">About</a></nav>
    </div>
    <div class="meta" id="meta"></div>
  </header>
  <nav class="picker" id="picker" aria-label="Choose a Corvette"></nav>

  <section class="card live" id="status-card">
    <div class="live-head" id="head"></div>
    <div class="live-verdict" id="title"></div>
    <div class="kpis" id="kpis"></div>
    <p class="note" id="kpi-note"></p>
  </section>

  <section class="card" id="champ-card" hidden style="margin-bottom:16px">
    <h2 id="champ-title">Championship if it finished now</h2>
    <div class="live-sub" id="champ-sub"></div>
    <div id="champ-event"></div>
    <div class="kpis" id="champ-kpis"></div>
    <h2 style="margin-top:16px">Title margin by lap</h2>
    <div class="legend" id="lg-margin"></div>
    <div class="chart" id="ch-margin"><div class="tip"></div></div>
  </section>

  <div class="charts">
    <section class="card">
      <h2>Lap times</h2>
      <div class="legend" id="lg-laps"></div>
      <div class="chart" id="ch-laps"><div class="tip"></div></div>
    </section>
    <section class="card">
      <h2>Gap to the car ahead and the leader</h2>
      <div class="legend" id="lg-gaps"></div>
      <div class="chart" id="ch-gaps"><div class="tip"></div></div>
    </section>
    <section class="card">
      <h2>Energy by lap</h2>
      <div class="legend" id="lg-energy"></div>
      <div class="chart" id="ch-energy"><div class="tip"></div></div>
    </section>
    <section class="card">
      <h2>Gap to the class leader</h2>
      <div class="legend" id="lg-lead"></div>
      <div class="chart" id="ch-lead"><div class="tip"></div></div>
    </section>
  </div>

  <section class="card" style="margin-top:16px">
    <h2 id="board-title">Class strategy board</h2>
    <div class="scroll"><table id="board"></table></div>
  </section>
  <footer id="foot"></footer>
</main>
<script>
const CLASS_NAMES = { GTDPRO: "GTD PRO", GTD: "GTD", GTP: "GTP", LMP2: "LMP2" };
// On-track roles use one validated set; the championship chart uses its own validated pair.
const C = { me: "var(--s1)", ahead: "var(--s2)", ref: "var(--s3)", ctx: "var(--context)", threat: "var(--s4)", target: "var(--s2)" };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const lapTime = t => t == null ? "–" : `${Math.floor(t / 60)}:${(t % 60).toFixed(1).padStart(4, "0")}`;
const signed = (v, d = 2) => v == null ? "–" : `${v > 0 ? "+" : v < 0 ? "−" : "±"}${Math.abs(v).toFixed(d)}`;
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
                set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
async function getJSON(p) { try { const r = await fetch(p, { cache: "no-cache" }); return r.ok ? await r.json() : null; } catch (e) { return null; } }

let standings, live, laps, schedule, entries;

async function load() {
  [standings, live, laps, schedule, entries] = await Promise.all(
    ["standings", "live", "laps", "schedule", "entries"].map(n => getJSON(`data/${n}.json`)));
  render();
}
addEventListener("hashchange", render);
setInterval(load, 30e3);

function selected() {
  const cars = standings?.cars || [];
  const want = location.hash.slice(1) || store.get("car");
  return cars.find(c => c.car === want) || cars[0];
}

// Least-squares line through the last n points: slope per x unit.
function fit(pts, n = 10) {
  const p = pts.slice(-n);
  if (p.length < 4) return null;
  const mx = p.reduce((a, q) => a + q[0], 0) / p.length, my = p.reduce((a, q) => a + q[1], 0) / p.length;
  const sxx = p.reduce((a, q) => a + (q[0] - mx) ** 2, 0);
  if (!sxx) return null;
  const slope = p.reduce((a, q) => a + (q[0] - mx) * (q[1] - my), 0) / sxx;
  return { slope, at: x => my + slope * (x - mx), x0: p[0][0], x1: p.at(-1)[0] };
}

// Clean laps: no in/out laps, no first lap, nothing over 107% of the car's best.
function clean(car) {
  const pit = new Set(car.stops.flatMap(s => [s, s + 1]));
  const l = car.laps.filter(([n]) => n > 1 && !pit.has(n));
  const best = Math.min(...l.map(q => q[1]));
  return l.filter(q => q[1] <= best * 1.07);
}

function render() {
  if (!standings?.cars) return;
  const sel = selected();
  store.set("car", sel.car);
  const groups = {};
  standings.cars.forEach(c => (groups[c.class] ||= []).push(c.car));
  $("picker").innerHTML = Object.entries(groups).map(([cls, cars]) => `<div><span>${esc(CLASS_NAMES[cls] || cls)}</span>`
    + cars.map(c => `<a href="#${esc(c)}"${c === sel.car ? ' aria-current="true"' : ""}>#${esc(c)}</a>`).join("") + `</div>`).join("");
  $("to-standings").href = "./#" + sel.car;
  const clsName = CLASS_NAMES[sel.class] || sel.class;
  document.title = `Race Strategy · #${sel.car}`;
  $("sub").textContent = `Race strategy · #${sel.car} ${entries?.cars?.[sel.car]?.team || ""} · ${clsName}`;

  const lc = live?.classes?.[sel.class];
  const age = live ? (Date.now() - new Date(live.updated)) / 60e3 : Infinity;
  const running = lc && age < 30;
  const next = (schedule?.sessions || []).find(s => new Date(s.start) > new Date());
  $("meta").innerHTML = next ? `Next WeatherTech session:<br><b>${esc(next.name)}</b> · ${new Date(next.start).toLocaleString([], { weekday: "short", hour: "numeric", minute: "2-digit" })}` : "";

  if (!lc) {
    $("head").innerHTML = `<span class="pulse" style="color:var(--text-3)">NO DATA</span>`;
    $("title").textContent = "No WeatherTech session recorded yet";
    $("kpis").innerHTML = "";
    $("kpi-note").textContent = "Strategy data is collected during WeatherTech sessions. It will appear here once the next one starts.";
    ["laps", "gaps", "energy", "lead"].forEach(k => { $("ch-" + k).querySelector("svg")?.remove(); });
    $("board").innerHTML = "";
    return;
  }

  const rows = lc.cars, me = rows.find(r => r.car === sel.car);
  const fc = lc.focus?.[sel.car] || {};
  const byCar = n => rows.find(r => r.car === n) || null;
  const ahead = byCar(fc.ahead), ref = byCar(fc.ref);
  const strat = lc.strategy?.cars || {};
  const lapsCls = laps?.classes?.[sel.class] || {};

  // --- status line
  const sess = live.session.replace(/^WeatherTech Championship( - )?/, "") || "Session";
  const flag = (live.flag || "").toLowerCase();
  const flagColor = flag.includes("green") ? "var(--good)" : flag.includes("yellow") || flag.includes("fcy") ? "var(--accent-ink)" : flag.includes("red") ? "var(--critical)" : "var(--text-2)";
  const tel = live.telemetry || {};
  $("status-card").classList.toggle("done", !running || live.finished);
  $("head").innerHTML = `<span class="pulse">${running && !live.finished ? "LIVE" : live.finished ? "FINISHED" : "LAST SESSION"}</span>
    <b>${esc(live.event)}</b> · ${esc(sess)} · ${esc(clsName)}
    <span class="flag" style="--f:${flagColor}">${esc(live.flag)}</span>
    <span class="ttg">${running && !live.finished ? esc((live.remaining || "").replace(/^00:/, "")) + " to go · " : ""}telemetry ${tel.connected ? "connected" : "offline"}</span>`;

  if (!me) {
    $("title").textContent = `#${sel.car} isn't in this session`;
    $("kpis").innerHTML = "";
  } else {
    $("title").innerHTML = `#${esc(sel.car)} P${me.class_pos} in ${esc(clsName)}${me.in_pit ? " · in the pits" : ""}`;
    renderKpis(me, strat[me.car], lc);
  }

  // --- charts
  const series = (car, color, role) => car && lapsCls[car.car] ? { car: car.car, color, role, d: lapsCls[car.car] } : null;
  const S = [series(me, C.me, "this car"), series(ahead, C.ahead, "car ahead"), series(ref, C.ref, fc.ref_role || "leader")].filter(Boolean);
  drawLapChart(S);
  drawGapChart(me && lapsCls[me.car], ahead, ref, fc.ref_role, lapsCls);
  drawEnergyChart(S.slice(0, 2), me);
  drawLeaderChart(S);
  renderChampionship(lc, fc, sel, lapsCls[sel.car], lapsCls);
  renderBoard(rows, strat, sel, lapsCls, clsName, fc);

  $("foot").innerHTML = `Timing from IMSA live scoring; energy, refuels and pit lane from IMSA telemetry (unofficial, about 1 Hz). `
    + `Updated ${new Date(live.updated).toLocaleTimeString()}. Estimates assume the current pace and energy use continue; yellows, short fills and strategy calls change them. `
    + `Unofficial fan site, not affiliated with IMSA, GM or Corvette Racing.`;
}

function kpi(k, v, s, extra = "") { return `<div class="kpi"><div class="k">${k}</div><div class="v">${v}</div>${extra}<div class="s">${s}</div></div>`; }

function renderKpis(me, st, lc) {
  const e = me.energy, s = me.stint, out = [];
  if (e) {
    out.push(kpi("Energy now", `${e.now.toFixed(1)}<small>%</small>`, e.use_per_lap ? `using ${e.use_per_lap}% per lap` : "use per lap after 3 laps on this tank",
      `<div class="ebar" role="img" aria-label="${e.now.toFixed(0)}% energy"><i style="width:${Math.max(0, Math.min(100, e.now))}%"></i></div>`));
    out.push(kpi("Laps left on this tank", e.laps_left != null ? Math.floor(e.laps_left) : "–", e.full_tank_laps ? `a full tank lasts ~${Math.floor(e.full_tank_laps)} laps` : "needs a few laps of data"));
    out.push(kpi("Next stop", e.next_stop_lap ? `Lap ${e.next_stop_lap}` : "–", e.eta_min != null ? `in ~${e.eta_min} min at current pace` : e.refuelling ? "refuelling now" : ""));
    const last = e.refills.at(-1);
    out.push(kpi("Next fill time", e.next_fill_secs ? `~${e.next_fill_secs}<small>s</small>` : "–",
      (last ? `last fill ${last.secs}s (${last.from.toFixed(0)}→${last.to.toFixed(0)}%)` : "no refuels seen yet") + (lc.fill_rate ? ` · class fills ${lc.fill_rate.toFixed(2)}%/s` : "")));
  } else if (s) {
    out.push(kpi("Stint", s.laps ?? "–", s.typical ? `typical full stint ${s.typical} laps (no telemetry)` : "no telemetry for this car"));
    out.push(kpi("Next stop", s.laps_to_typical != null ? `~${Math.max(s.laps_to_typical, 0)} laps` : "–", s.eta_min ? `~${s.eta_min} min` : ""));
  } else {
    out.push(kpi("Energy", "–", "no telemetry for this car yet"));
  }
  const done = me.pit_stops ?? 0;
  out.push(kpi("Stops", e?.stops_remaining != null ? `${done} + ~${e.stops_remaining}` : done,
    e?.stops_remaining != null ? `~${done + e.stops_remaining} in total by the flag` : "estimate shows during the race"));
  out.push(kpi("Pace", st?.pace ? lapTime(st.pace) : "–",
    st?.trend == null ? "last 5 clean laps" : st.trend < -0.05 ? `▲ ${Math.abs(st.trend).toFixed(2)}s quicker than the 5 before` : st.trend > 0.05 ? `▼ ${st.trend.toFixed(2)}s slower than the 5 before` : "steady over the last 10 laps"));
  $("kpis").innerHTML = out.join("");
  $("kpi-note").textContent = lc.strategy ? `Pace and trends recalculated every 5 minutes (last ${new Date(lc.strategy.updated).toLocaleTimeString()}). Energy and stops update every poll.` : "";
}

// --- generic line chart with crosshair tooltip (one y axis) ------------------------
function lineChart(id, { series, yFmt = v => v.toFixed(1), yDomain, invert = false, empty = "Not enough laps yet.", zeroLine = false, robust = false }) {
  const el = $(id), tip = el.querySelector(".tip");
  el.querySelector("svg")?.remove();
  el.querySelector(".empty")?.remove();
  const pts = series.flatMap(s => s.pts);
  if (pts.length < 2) { el.insertAdjacentHTML("afterbegin", `<p class="empty">${empty}</p>`); return; }
  const W = Math.max(300, el.clientWidth), H = 220, m = { t: 10, r: 54, b: 24, l: 50 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const xs = pts.map(p => p[0]), x0 = Math.min(...xs), x1 = Math.max(...xs, x0 + 1);
  // Robust charts scale to the middle 96% of values; pit-cycle spikes run off the edge.
  const ys = pts.map(p => p[1]).sort((a, b) => a - b), q = f => ys[Math.round(f * (ys.length - 1))];
  let [y0, y1] = yDomain || (robust ? [q(0.02), q(0.98)] : [ys[0], ys.at(-1)]);
  if (y1 - y0 < 1e-6) { y0 -= 1; y1 += 1; }
  if (!yDomain) { const pad = (y1 - y0) * 0.08; y0 -= pad; y1 += pad; }
  const x = v => m.l + (v - x0) / (x1 - x0) * iw;
  const y = v => invert ? m.t + (v - y0) / (y1 - y0) * ih : m.t + ih - (v - y0) / (y1 - y0) * ih;
  let g = "";
  for (let i = 0; i <= 4; i++) { const v = y0 + (y1 - y0) * i / 4;
    g += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)"/><text x="${m.l - 6}" y="${y(v) + 4}" text-anchor="end">${yFmt(v)}</text>`; }
  if (zeroLine && y0 < 0 && y1 > 0) g += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(0)}" y2="${y(0)}" stroke="var(--text-3)" stroke-dasharray="2 3"/>`;
  const step = Math.max(1, Math.ceil((x1 - x0) / Math.floor(iw / 48)));
  for (let v = Math.ceil(x0); v <= x1; v += step) g += `<text x="${x(v)}" y="${H - 6}" text-anchor="middle">${v}</text>`;
  let lines = "", labels = "";
  const ends = [];
  for (const s of series) {
    if (!s.pts.length) continue;
    lines += `<polyline fill="none" stroke="${s.color}" stroke-width="${s.width || 2}" ${s.dash ? `stroke-dasharray="${s.dash}"` : ""} stroke-linejoin="round" stroke-linecap="round" points="${s.pts.map(p => `${x(p[0])},${y(Math.max(y0, Math.min(y1, p[1])))}`).join(" ")}"/>`;
    if (s.end) { const p = s.pts.at(-1); ends.push({ x: x(p[0]) + 6, y: y(Math.max(y0, Math.min(y1, p[1]))) + 4, t: s.end }); }
  }
  // Keep end labels at least 13px apart vertically.
  ends.sort((a, b) => a.y - b.y).forEach((l, i, a) => { if (i && l.y - a[i - 1].y < 13) l.y = a[i - 1].y + 13; });
  for (const l of ends) labels += `<text class="endlbl" x="${l.x}" y="${l.y}">${esc(l.t)}</text>`;
  el.insertAdjacentHTML("afterbegin", `<svg viewBox="0 0 ${W} ${H}" role="img">${g}${lines}${labels}
    <line class="xh" y1="${m.t}" y2="${m.t + ih}" stroke="var(--text-3)" stroke-dasharray="3 3" visibility="hidden"/>
    <rect class="hit" x="${m.l}" y="${m.t}" width="${iw}" height="${ih}" fill="transparent"/></svg>`);
  const svg = el.querySelector("svg"), xh = svg.querySelector(".xh"), named = series.filter(s => s.name);
  svg.querySelector(".hit").addEventListener("pointermove", ev => {
    const r = svg.getBoundingClientRect(), v = Math.round(x0 + ((ev.clientX - r.left) * W / r.width - m.l) / iw * (x1 - x0));
    xh.setAttribute("x1", x(v)); xh.setAttribute("x2", x(v)); xh.setAttribute("visibility", "visible");
    tip.innerHTML = `<b>Lap ${v}</b>` + named.map(s => { const p = s.pts.find(q => q[0] === v);
      return `<div><span><i style="--c:${s.color}"></i>${esc(s.name)}</span><span>${p ? yFmt(p[1]) : "–"}</span></div>`; }).join("");
    tip.style.display = "block";
    tip.style.left = Math.min(x(v) / W * r.width + 12, r.width - tip.offsetWidth) + "px"; tip.style.top = "8px";
  });
  svg.querySelector(".hit").addEventListener("pointerleave", () => { tip.style.display = "none"; xh.setAttribute("visibility", "hidden"); });
}

function trendSeries(pts, color, unit) {
  const f = fit(pts);
  if (!f) return [];
  return [{ pts: [[f.x0, f.at(f.x0)], [f.x1, f.at(f.x1)]], color, dash: "5 4", width: 1.5, end: `${signed(f.slope)}${unit}` }];
}

function drawLapChart(S) {
  const series = [];
  for (const s of S) {
    const c = clean(s.d);
    series.push({ name: `#${s.car} (${s.role})`, pts: c, color: s.color, width: s.role === "this car" ? 2 : 1.25 });
    series.push(...trendSeries(c, s.color, "s/lap"));
  }
  lineChart("ch-laps", { series, yFmt: lapTime, invert: false });
  $("lg-laps").innerHTML = S.map(s => `<span style="--c:${s.color}">#${esc(s.car)} ${s.role}</span>`).join("")
    + `<span style="--c:var(--text-3)">dashed: trend over the last 10 clean laps</span>`;
}

// Laps affected by a pit stop (in-lap through two laps after), left out of gap lines and trends.
const pitLaps = d => new Set((d.stops || []).flatMap(s => [s - 1, s, s + 1, s + 2]));
const offPit = (pts, ...cars) => { const skip = new Set(cars.flatMap(c => [...pitLaps(c)])); return pts.filter(([n]) => !skip.has(n)); };

// Gap between two cars per lap, from each car's gap to the class leader on that lap.
function between(a, b) {
  const m = new Map((b.gaps || []).map(([n, g]) => [n, g]));
  return offPit((a.gaps || []).filter(([n]) => m.has(n)).map(([n, g]) => [n, +(g - m.get(n)).toFixed(3)]), a, b);
}

function drawGapChart(me, ahead, ref, refRole, lapsCls) {
  const series = [], lg = [];
  if (me && ahead && lapsCls[ahead.car]) {
    const p = between(me, lapsCls[ahead.car]);
    series.push({ name: `behind #${ahead.car}`, pts: p, color: C.ahead }, ...trendSeries(p, C.ahead, "s/lap"));
    lg.push(`<span style="--c:${C.ahead}">seconds behind #${esc(ahead.car)} (car ahead)</span>`);
  }
  if (me && ref && lapsCls[ref.car]) {
    const leading = refRole === "car behind";
    const p = leading ? between(lapsCls[ref.car], me) : between(me, lapsCls[ref.car]);
    series.push({ name: leading ? `ahead of #${ref.car}` : `behind #${ref.car}`, pts: p, color: C.ref }, ...trendSeries(p, C.ref, "s/lap"));
    lg.push(`<span style="--c:${C.ref}">seconds ${leading ? "ahead of" : "behind"} #${esc(ref.car)} (${esc(refRole)})</span>`);
  }
  lineChart("ch-gaps", { series, robust: true, zeroLine: true, yFmt: v => v.toFixed(1) + "s", empty: "Gaps build up once the race is running." });
  $("lg-gaps").innerHTML = lg.join("") + `<span style="--c:var(--text-3)">dashed: trend over the last 10 laps (falling = gap shrinking)</span>`;
}

function drawEnergyChart(S, me) {
  const series = S.filter(s => s.d.energy?.length).map(s => ({ name: `#${s.car}`, pts: s.d.energy, color: s.color, width: s.role === "this car" ? 2 : 1.25 }));
  const e = me?.energy;
  if (e?.next_stop_lap && series.length) {
    const last = S[0].d.energy.at(-1);
    if (last) series.push({ pts: [last, [e.next_stop_lap, Math.max(0, last[1] - e.use_per_lap * (e.next_stop_lap - last[0]))]], color: C.me, dash: "5 4", width: 1.5, end: `stop ~L${e.next_stop_lap}` });
  }
  lineChart("ch-energy", { series, yFmt: v => v.toFixed(0) + "%", yDomain: [0, 100], empty: "No telemetry recorded for this car yet." });
  $("lg-energy").innerHTML = S.map(s => `<span style="--c:${s.color}">#${esc(s.car)} ${s.role}</span>`).join("")
    + (e?.next_stop_lap ? `<span style="--c:var(--text-3)">dashed: projected to the next stop</span>` : "");
}

function drawLeaderChart(S) {
  const series = [];
  for (const s of S) { const p = offPit(s.d.gaps || [], s.d); series.push({ name: `#${s.car}`, pts: p, color: s.color, width: s.role === "this car" ? 2 : 1.25 }); }
  const mine = S[0] ? trendSeries(offPit(S[0].d.gaps || [], S[0].d), S[0].color, "s/lap") : [];
  lineChart("ch-lead", { series: [...series, ...mine], robust: true, yFmt: v => v.toFixed(0) + "s", empty: "Gaps build up once the race is running." });
  $("lg-lead").innerHTML = S.map(s => `<span style="--c:${s.color}">#${esc(s.car)} ${s.role}</span>`).join("")
    + `<span style="--c:var(--text-3)">seconds behind the class leader; dashed: trend</span>`;
}

function renderBoard(rows, strat, sel, lapsCls, clsName, fc) {
  const corvettes = standings.cars.filter(c => c.class === sel.class).map(c => c.car);
  $("board-title").textContent = `${clsName} strategy board`;
  $("board").innerHTML = `<thead><tr><th>Pos</th><th title="Class position once every car has made the stops it owes in this pit cycle">Net</th><th>Car</th><th class="l">Driver</th><th class="l">Energy</th><th>Use/lap</th><th>Laps left</th><th>Next stop</th><th>Stops</th><th>Last fill</th><th>Pace</th><th>Trend</th><th title="Change in gap to the class leader per lap, last 10 laps">Gap trend</th></tr></thead><tbody>`
    + rows.map(r => { const e = r.energy || {}, x = strat[r.car] || {}, g = fit(lapsCls[r.car]?.gaps || []);
      const last = e.refills?.at(-1);
      return `<tr class="${corvettes.includes(r.car) ? "tracked" : ""}" style="--c:${r.car === sel.car ? C.me : corvettes.includes(r.car) ? "var(--series-2)" : C.ctx}">
        <td>${r.class_pos}</td><td class="dim">${r.net_pos ?? "–"}</td><td>#${esc(r.car)}${[fc.champ_behind, fc.champ_ahead].includes(r.car) ? ` <span class="owes" title="Championship rival">TITLE</span>` : ""}</td>
        <td class="l team">${esc(r.driver)}${r.in_pit ? ` <span class="pit">PIT</span>` : ""}${r.owes_stop ? `<span class="owes" title="Still owes a stop in this pit cycle">OWES STOP</span>` : ""}</td>
        <td class="l">${e.now != null ? `<span class="mini"><i style="width:${Math.max(0, Math.min(100, e.now))}%"></i></span>${e.now.toFixed(0)}%` : "–"}</td>
        <td>${e.use_per_lap ?? "–"}</td><td>${e.laps_left != null ? Math.floor(e.laps_left) : "–"}</td><td>${e.next_stop_lap ? "L" + e.next_stop_lap : "–"}</td>
        <td>${r.pit_stops ?? "–"}${e.stops_remaining != null ? ` <span class="dim">+${e.stops_remaining}</span>` : ""}</td>
        <td class="dim">${last ? last.secs + "s" : "–"}</td><td>${lapTime(x.pace)}</td>
        <td class="${x.trend < -0.05 ? "up" : x.trend > 0.05 ? "down" : "dim"}">${signed(x.trend)}</td>
        <td class="${g && g.slope < -0.05 ? "up" : g && g.slope > 0.05 ? "down" : "dim"}">${g ? signed(g.slope) + "s" : "–"}</td></tr>`; }).join("")
    + `</tbody>`;
}

function renderChampionship(lc, fc, sel, myLaps, lapsCls) {
  const show = live.is_race && fc.champ_pos;
  $("champ-card").hidden = !show;
  if (!show) return;
  const net = fc.basis === "net";
  const mg = (n, r) => n == null ? "–" : `${n > 0 ? "+" : n < 0 ? "−" : "±"}${Math.abs(n)}`;
  $("champ-title").textContent = `Championship if it finished now${net ? " (after pit stops)" : ""}`;
  $("champ-sub").innerHTML = net
    ? "Using the <b>net</b> order: cars that still owe a stop in this pit cycle are moved back by the pit loss. Raw order in brackets."
    : "Using the running order (the net order needs a pit-loss figure and green-flag running).";
  const ev = fc.events?.at(-1);
  $("champ-event").innerHTML = ev && ev.to ? `<p class="event">Title ${ev.role === "champ_behind" ? "threat" : "target"} is now <b>#${esc(ev.to)}</b>${ev.from ? ` (was #${esc(ev.from)})` : ""}, since lap ${ev.lap}.</p>` : "";
  const k = (a, b, c) => `<div class="kpi"><div class="k">${a}</div><div class="v">${b}</div><div class="s">${c}</div></div>`;
  const tiles = [k("Title position", `P${fc.champ_pos}`, `${net ? "net" : "raw"} projection`)];
  if (fc.champ_behind) tiles.push(k(`Ahead of #${esc(fc.champ_behind)}`, `${mg(net ? fc.net_margin_behind : fc.margin_behind)}<small>pts</small>`,
    `raw ${mg(fc.margin_behind)} · ${fc.we_hold_vs_behind ? `stays ahead finishing P${fc.we_hold_vs_behind} or better` : "would lose it as things stand"}`));
  if (fc.champ_ahead) tiles.push(k(`Behind #${esc(fc.champ_ahead)}`, `${mg(net ? fc.net_margin_ahead : fc.margin_ahead)}<small>pts</small>`,
    `raw ${mg(fc.margin_ahead)} · ${fc.we_need_vs_ahead ? `gets ahead finishing P${fc.we_need_vs_ahead} or better` : "can't get ahead unless it drops back"}`));
  tiles.push(k("A place is worth", `+${fc.place_gain}<small>/ −${fc.place_lose}</small>`, "gaining one class position / losing one"));
  if (fc.champ_behind) tiles.push(k(`#${esc(fc.champ_behind)} needs`, fc.rival_needs ? `P${fc.rival_needs}` : "–",
    fc.rival_needs ? `or better to pass #${esc(sel.car)}, everyone else holding` : `can't pass #${esc(sel.car)} unless #${esc(sel.car)} drops back`));
  $("champ-kpis").innerHTML = tiles.join("");

  // Title margin by lap: net solid, raw dotted, one colour per rival role.
  const m = myLaps?.margins || [], series = [];
  // Only the laps where this car was the rival in that role (switches are in the banner above).
  const add = (iRaw, iNet, iCar, color, role) => {
    const car = role === "behind" ? fc.champ_behind : fc.champ_ahead;
    if (!car) return null;
    // Leave out laps around either car's stops: positions are mid-stop there, not real changes.
    const skip = new Set([...pitLaps(myLaps || {}), ...pitLaps(lapsCls[car] || {})]);
    const mine = m.filter(r => r[iCar] === car && !skip.has(r[0]));
    const netPts = mine.filter(r => r[iNet] != null).map(r => [r[0], r[iNet]]);
    const rawPts = mine.filter(r => r[iRaw] != null).map(r => [r[0], r[iRaw]]);
    if (!rawPts.length) return null;
    series.push({ name: `vs #${car} ${role} (net)`, pts: netPts, color, end: netPts.length ? `#${car}` : null });
    series.push({ name: `vs #${car} ${role} (raw)`, pts: rawPts, color, dash: "1 4", width: 1.5, end: netPts.length ? null : `#${car}` });
    return car;
  };
  const tb = add(1, 2, 5, C.threat, "behind"), ta = add(3, 4, 6, C.target, "ahead");
  lineChart("ch-margin", { series, zeroLine: true, robust: true, yFmt: v => (v > 0 ? "+" : "") + v.toFixed(0), empty: "Builds up lap by lap during the race." });
  $("lg-margin").innerHTML = (tb ? `<span style="--c:${C.threat}">points ahead of #${esc(tb)} (title threat)</span>` : "")
    + (ta ? `<span style="--c:${C.target}">points behind #${esc(ta)} (title target)</span>` : "")
    + `<span style="--c:var(--text-3)">solid: net order · dotted: raw running order · above zero = ahead</span>`;
}

let width = innerWidth;
addEventListener("resize", () => { if (Math.abs(innerWidth - width) > 40) { width = innerWidth; render(); } });
load();
</script>
</body>
</html>
