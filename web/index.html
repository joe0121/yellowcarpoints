<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yellow Car Points</title>
<meta name="description" content="Live IMSA WeatherTech championship standings for the Corvette Racing entries.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23eda100'/><text x='16' y='23' font-size='18' font-family='Arial' font-weight='700' text-anchor='middle' fill='%23111'>4</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
<script src="theme.js"></script>
<script src="account.js"></script>
<script src="track.js"></script>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Yellow Car <span>Points</span></h1>
      <p class="sub" id="sub">IMSA WeatherTech SportsCar Championship</p>
      <div class="navrow"><nav class="tabs"><a href="./" aria-current="page">Championship</a><a id="to-strategy" href="strategy.html">Race</a><a href="about.html">About</a><a href="guestbook.html">Guest book</a></nav><span class="countdown" id="countdown" hidden></span></div>
    </div>
    <div class="meta" id="meta"></div>
  </header>
  <nav class="picker" id="picker" aria-label="Choose a car"></nav>
  <nav class="links" id="links" aria-label="IMSA and team links"></nav>
  <section class="cars" id="cars"></section>
  <section class="card live" id="proj-card" hidden aria-live="polite"></section>
  <section class="card" id="recap-card" hidden>
    <h2 id="recap-title">Last race</h2>
    <p class="live-sub" id="recap-sub"></p>
    <div class="scroll"><table id="recap"></table></div>
    <p class="note" id="recap-note"></p>
  </section>
  <section class="card" id="fight-card" hidden>
    <h2 id="fight-title">Still in contention</h2>
    <p class="live-sub" id="fight-sub"></p>
    <div class="legend" id="fight-legend"></div>
    <div class="chart" id="fight-chart"><div class="tip"></div></div>
  </section>
  <section class="card" id="table-card" hidden>
    <h2 id="table-title">Standings</h2>
    <div class="scroll"><table id="table"></table></div>
  </section>
  <section class="card" id="chart-card" hidden>
    <h2>Points behind the leader</h2>
    <div class="legend" id="legend"></div>
    <div class="chart" id="chart"><div class="tip" id="tip"></div></div>
  </section>
  <details class="card fold" id="hist-card" hidden>
    <summary><h2 id="hist-title">Race by race</h2></summary>
    <div class="scroll"><table id="hist"></table></div>
  </details>
  <footer id="foot"></footer>
  <nav class="footlinks" aria-label="About this site">
    <a href="https://github.com/joe0121/yellowcarpoints" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 0 0-3.2 19.5c.5.1.7-.2.7-.5v-1.7c-2.8.6-3.4-1.3-3.4-1.3-.5-1.2-1.1-1.5-1.1-1.5-.9-.6.1-.6.1-.6 1 .1 1.6 1 1.6 1 .9 1.6 2.4 1.1 3 .9.1-.7.4-1.1.6-1.4-2.2-.3-4.6-1.1-4.6-5 0-1.1.4-2 1-2.7-.1-.3-.4-1.3.1-2.7 0 0 .8-.3 2.8 1a9.6 9.6 0 0 1 5 0c1.9-1.3 2.7-1 2.7-1 .6 1.4.2 2.4.1 2.7.6.7 1 1.6 1 2.7 0 3.9-2.4 4.7-4.6 5 .4.3.7.9.7 1.9V21c0 .3.2.6.7.5A10 10 0 0 0 12 2z"/></svg>Source on GitHub</a>
    <a href="https://www.instagram.com/c6zoooh6/" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="17.4" cy="6.6" r="1.3" fill="currentColor"/></svg>@C6ZOOOH6</a>
    <a href="contact.html">Contact</a>

</main>
<script src="cards.js"></script>
<script src="links.js"></script>
<script src="picker.js"></script>
<script>
addEventListener("cardtoggle", () => standings && renderAll());
const CLASS_NAMES = { GTDPRO: "GTD PRO", GTD: "GTD", GTP: "GTP", LMP2: "LMP2" };
const COLORS = ["var(--accent)", "var(--series-2)"];
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = n => n.toLocaleString("en-US");
const ord = n => n + (["th", "st", "nd", "rd"][(n % 100 - 20) % 10] || ["th", "st", "nd", "rd"][n % 100] || "th");
const roundPts = r => r ? (r.q || 0) + (r.r || 0) : 0;
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
                set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };

let standings = null, live = null, hist = null, entries = null, config;

// The selected car comes from the URL (#13), then the last choice, then the first configured car.
function selected() {
  return window.pickCar({ standings, entries, live }, store);
}

// One class's standings, shaped for rendering: tracked[0] is the selected car,
// the rest are the other Corvettes in that class.
function view(sel) {
  const c = standings.classes[sel.class];
  const others = standings.cars.filter(x => x.class === sel.class && x.car !== sel.car).map(x => x.car);
  return { ...c, class: sel.class, tracked: [sel.car, ...others],
    season: standings.season, event: standings.event, status: standings.status, url: standings.url, updated: standings.updated };
}

function colorFor(d) {
  return car => { const i = d.tracked.indexOf(car); return i < 0 ? "var(--context)" : COLORS[Math.min(i, 1)]; };
}

async function getJSON(path) {
  try {
    const res = await fetch(path, { cache: "no-cache" });
    return res.ok ? await res.json() : null;
  } catch (e) { return null; }
}

async function load() {
  [standings, hist, entries, config] = await Promise.all(["standings", "history", "entries", "config"].map(n => getJSON(`data/${n}.json`)));
  if (!standings || !standings.classes) {
    $("cars").innerHTML = `<div class="card err">Standings aren't available yet. Check back shortly.</div>`;
    return;
  }
  await loadLive();
  renderAll();
}

function renderAll() {
  const sel = selected();
  store.set("car", sel.car);
  window.setLivery?.(sel.car);
  window.renderLinks?.(sel.car);
  // Every Pratt Miller-built car we follow, by class. Race-only cars (the #73 LMP2) have no
  // championship maths, so they link to their Race view.
  window.buildPicker($("picker"), sel, { standings, entries, live, config });
  $("to-strategy").href = "strategy.html#" + sel.car;
  const d = view(sel);
  render(d);
  renderHistory(sel, d);
  renderTitle(d);
  renderProjection(d);
  renderRecap(d);
}
addEventListener("hashchange", () => standings && renderAll());

function render(d) {
  const cls = CLASS_NAMES[d.class] || d.class;
  const colorOf = colorFor(d);
  const st = d.standings;
  const next = d.events.find(e => e.state === "upcoming");
  const done = d.events.map((e, i) => ({ ...e, i })).filter(e => e.state === "done");
  const car = d.tracked[0];

  document.title = `Yellow Car Points · #${car} ${cls}`;
  $("sub").textContent = `${d.season} IMSA WeatherTech SportsCar Championship · ${cls}`;
  $("meta").innerHTML = `After <b>${esc(d.event)}</b> <span class="badge ${d.status === "Official" ? "" : "prov"}">${esc(d.status)}</span><br>`
    + (next ? `Next: ${esc(next.name)} · ` : "Season complete · ")
    + `${d.rounds_remaining} round${d.rounds_remaining === 1 ? "" : "s"} left`;

  // --- hero card for the selected car
  const t = st.find(s => s.car === car);
  // This weekend's entry (team, drivers, car) from the latest session's official results.
  const entry = entries?.cars?.[car];
  const weekend = entry ? `<div class="drivers">At ${esc(entries.event)}: ${esc(entry.drivers.join(" · "))}</div>`
    : entries ? `<div class="drivers">Not entered at ${esc(entries.event)}.</div>` : "";
  if (!t) {
    const where = entry ? `Entered in ${esc(CLASS_NAMES[entry.class] || entry.class)} at ${esc(entries.event)} (${esc(entry.vehicle)}).` : "";
    $("cars").innerHTML = `<article class="card car" style="--c:${colorOf(car)}">
      <div class="car-head"><div class="car-no"><i></i>#${esc(car)} <small class="drivers">${esc(entry?.team || "")}</small></div><span class="status" style="color:var(--text-3)">No ${esc(cls)} points</span></div>
      ${entry ? `<div class="drivers">${esc(entry.drivers.join(" · "))}</div>` : ""}
      <p class="verdict">${where} It hasn't scored ${esc(cls)} championship points in ${d.season}, so it isn't in the standings. Its live timing, lap times and pit strategy are on the Race tab.</p>
    </article>`;
  } else {
    const ahead = st.find(s => s.pos === t.pos - 1), behind = st.find(s => s.pos === t.pos + 1);
    const left = d.max_points_remaining;
    // The headline answer (what it needs) is filled in by renderTitle.
    const lead = t.pos === 1 && behind ? t.points - behind.points : 0;
    const [status, color] = t.pos === 1 && lead > left ? ["Champions", "var(--good)"] : t.pos === 1 ? ["Leading", "var(--accent-ink)"]
      : t.alive ? ["In contention", "var(--accent-ink)"] : ["Out of title contention", "var(--text-3)"];
    const best = Math.max(...t.rounds.map(roundPts));
    $("cars").innerHTML = `<article class="card car" style="--c:${colorOf(car)}">
      <div class="car-head"><div class="car-no"><i></i>#${esc(car)} <small class="drivers">${esc(t.team)}</small></div><span class="status" style="color:${color}">${status}</span></div>
      <div class="drivers">${esc(t.drivers.join(" · "))}</div>
      ${weekend}
      <div class="hero"><span class="num pos">P${t.pos}</span><span class="num pts">${fmt(t.points)}<small>pts</small></span></div>
      <div class="needs-mode" id="needs-mode"></div>
      <div id="answer"></div>
      <div class="facts">
        <div>To car ahead<b>${ahead ? "−" + fmt(ahead.points - t.points) : "—"}</b></div>
        <div>To car behind<b>${behind ? "+" + fmt(t.points - behind.points) : "—"}</b></div>
        <div>Best round<b>${fmt(best)}</b></div>
      </div>
    </article>`;
  }

  // --- chart: cumulative points by completed round
  $("chart-card").hidden = done.length < 2;
  if (done.length > 1) {
    const cum = s => { let sum = 0; return done.map(e => (sum += roundPts(s.rounds[e.i]))); };
    const all = st.map(s => ({ s, total: cum(s) }));
    const lead = done.map((e, i) => Math.max(...all.map(a => a.total[i])));
    const series = all.filter(a => d.tracked.includes(a.s.car) || a.s.pos <= 8)
      .map(a => ({ s: { ...a.s, tracked: d.tracked.includes(a.s.car) }, pts: a.total, gap: a.total.map((v, i) => lead[i] - v) }));
    // Context first, then other Corvettes, then the selected car on top.
    const rank = s => s.car === car ? 2 : s.tracked ? 1 : 0;
    series.sort((a, b) => rank(a.s) - rank(b.s));
    drawState = { series, done, colorOf };
    drawChart(series, done, colorOf);
    const others = d.tracked.slice(1).filter(c => st.some(s => s.car === c));
    $("legend").innerHTML = `<span style="--c:${colorOf(car)}">#${esc(car)}</span>`
      + (others.length ? `<span style="--c:${COLORS[1]}">Other cars we follow (${others.map(c => "#" + esc(c)).join(", ")})</span>` : "")
      + `<span style="--c:var(--context)">Rest of top 8</span>`;
  }

  // --- standings table
  $("table-title").textContent = `${cls} team standings`;
  $("table").innerHTML = `<thead><tr><th>Pos</th><th>Car</th><th class="l">Team</th><th>Pts</th><th>Gap</th>`
    + done.map(e => `<th class="rnd" title="${esc(e.name)}">${esc(e.name.split(" ")[0].slice(0, 4))}</th>`).join("")
    + `</tr></thead><tbody>`
    + st.map(s => `<tr class="${d.tracked.includes(s.car) ? "tracked" : ""}" style="--c:${colorOf(s.car)}">
        <td>${s.pos}</td><td>#${esc(s.car)}</td>
        <td class="l team">${esc(s.team)}<div>${esc(s.drivers.join(" · "))}</div></td>
        <td class="total">${fmt(s.points)}</td><td class="dim">${s.gap ? "−" + fmt(s.gap) : "—"}</td>`
      + done.map(e => { const r = s.rounds[e.i]; return `<td class="rnd">${r && (r.q !== null || r.r !== null) ? roundPts(r) : "–"}</td>`; }).join("")
      + `</tr>`).join("") + `</tbody>`;
  $("table-card").hidden = false;

  $("foot").innerHTML = `Data: <a href="${esc(d.url)}" rel="noopener">IMSA championship points (${esc(d.status)})</a>, race reports and live timing via Al Kamel. `
    + `Checked ${new Date(d.updated).toLocaleString()}. Unofficial fan site, not affiliated with IMSA, GM or Corvette Racing.`;
}

let drawState = null, chartWidth = 0;
addEventListener("resize", () => {
  if (drawState && $("chart").clientWidth !== chartWidth) drawChart(drawState.series, drawState.done, drawState.colorOf);
});

// --- season history (data/history.json, from Al Kamel race reports)
function renderHistory(sel, d) {
  const rows = (hist?.cars?.[sel.car] || []).slice().reverse();
  $("hist-card").hidden = !rows.length;
  if (!rows.length) return;
  $("hist-title").textContent = `#${sel.car} race by race`;
  const avg = stops => { const t = stops.map(s => secsOf(s.time)).filter(Boolean); return t.length ? (t.reduce((a, b) => a + b) / t.length).toFixed(1) + "s" : "–"; };
  $("hist").innerHTML = `<thead><tr><th class="l">Race</th><th>Finish</th><th>Grid</th><th>Laps</th><th>Best lap</th><th>Stops</th><th>Avg stop</th><th class="l">Stints (laps)</th><th class="l">Drivers (laps)</th></tr></thead><tbody>`
    + rows.map(r => `<tr>
        <td class="l">${esc(r.round)}</td>
        <td class="total">${r.status === "Classified" ? `P${r.class_pos}` : esc(r.status)}<span class="dim"> / ${r.class_entries}</span></td>
        <td>${r.grid ? "P" + r.grid : "–"}</td><td>${r.laps}</td>
        <td>${esc(r.best_lap || "–")}${r.best_lap_rank ? `<span class="dim"> (${ord(r.best_lap_rank)})</span>` : ""}</td>
        <td>${r.stops.length}</td><td class="dim">${avg(r.stops)}</td>
        <td class="stints">${r.stints.join(" · ")}</td>
        <td class="l stints">${r.drivers.map(x => `${esc(x.name)} ${x.laps}`).join(" · ")}</td></tr>`).join("")
    + `</tbody>`;
}
const secsOf = t => { if (!t) return null; let s = 0; for (const p of String(t).split(":")) s = s * 60 + parseFloat(p); return s; };

// --- championship maths (title fight, what the selected car needs, live projection) ---
const FLAG_COLORS = { green: "var(--good)", yellow: "var(--flag-yellow)", fcy: "var(--flag-yellow)", red: "var(--critical)" };
const RACE_POINTS = [350, 320, 300, 280, 260, 250, 240, 230, 220, 210, 200, 190, 180, 170, 160, 150, 140, 130, 120, 110, 100, 90, 80, 70, 60, 50, 40, 30, 20, 10];
const racePts = p => p >= 1 && p <= RACE_POINTS.length ? RACE_POINTS[p - 1] : 0;
const qualiPts = p => Math.floor(racePts(p) / 10);
let laps = null, quali = null;

async function loadLive() {
  [live, laps, quali] = await Promise.all(["live", "laps", "quali"].map(n => getJSON(`data/${n}.json`)));
}
// A race projection stays up until the official points include it.
function raceLive(cls) {
  return live?.is_race && live.classes?.[cls]?.standings && live.base_event === standings.event
    && Date.now() - new Date(live.updated) < 48 * 3600e3 ? live.classes[cls] : null;
}
// Live timing every 10 s, the lap-by-lap margins and qualifying every minute; redraw only on change.
let lapsAt = 0;
setInterval(async () => {
  if (!standings) return;
  const now = Date.now(), slow = now - lapsAt >= 60e3, was = live?.updated;
  if (slow) { await loadLive(); lapsAt = now; } else live = await getJSON("data/live.json");
  if (!slow && live?.updated === was) return;
  const d = view(selected()); renderTitle(d); renderProjection(d); renderRecap(d);
}, 10e3);

// Title fight: who can still win, where they are running, and what the selected car needs.
function renderTitle(d) {
  const st = d.standings, car = d.tracked[0], me = st.find(s => s.car === car);
  $("fight-card").hidden = !me;
  if (!me) return;
  const cls = CLASS_NAMES[d.class] || d.class;
  const left = d.max_points_remaining, after = Math.max(d.rounds_remaining - 1, 0) * d.max_points_per_round;
  const lc = raceLive(d.class);
  const running = lc ? Object.fromEntries(lc.cars.map(r => [r.car, r])) : {};
  const proj = lc ? Object.fromEntries(lc.standings.map(r => [r.car, r])) : {};
  const qmap = quali && live && quali.event === live.event ? quali.classes?.[d.class] : null;
  const q = c => qmap && qmap[c] ? qualiPts(qmap[c]) : null;
  const colorOf = colorFor(d);
  const contenders = st.filter(s => s.alive || s.car === car).sort((a, b) => b.points - a.points)
    .filter((s, i) => i < 8 || s.car === car);
  // Clinch line: one point more than the best total anyone but the leader could still reach.
  const clinch = st.length > 1 ? Math.max(...st.slice(1).map(s => s.points + left)) + 1 : null;

  // Chart: points now (bar), the most each can still reach (dashed), points if the race ended now (diamond).
  const el = $("fight-chart");
  el.querySelector("svg")?.remove();
  const W = Math.max(320, el.clientWidth), rowH = 32, m = { t: 24, r: W < 560 ? 110 : 170, b: 22, l: 56 };
  const H = m.t + m.b + contenders.length * rowH, iw = W - m.l - m.r;
  // Early in the season (more points left than anyone has) the axis starts at zero; late on it zooms in.
  const lo = left > contenders[0].points ? 0 : Math.min(...contenders.map(s => s.points)) - 40;
  const hi = Math.max(...contenders.map(s => s.points + left), ...contenders.map(s => proj[s.car]?.projected || 0), clinch || 0) + 10;
  const x = v => m.l + (v - lo) / (hi - lo) * iw;
  const step = [100, 200, 500, 1000].find(v => (hi - lo) / v <= 8) || 2000;
  let g = "";
  for (let v = Math.ceil(lo / step) * step; v <= hi; v += step)
    g += `<line x1="${x(v)}" x2="${x(v)}" y1="${m.t - 4}" y2="${H - m.b}" stroke="var(--grid)"/><text x="${x(v)}" y="${H - 6}" text-anchor="middle">${fmt(v)}</text>`;
  const leaderPts = contenders[0].points;
  g += `<line x1="${x(leaderPts)}" x2="${x(leaderPts)}" y1="${m.t - 8}" y2="${H - m.b}" stroke="var(--text-3)" stroke-dasharray="2 3"/>`
    + `<text x="${x(leaderPts)}" y="${m.t - 12}" text-anchor="middle">leader now</text>`;
  if (clinch) g += `<line x1="${x(clinch)}" x2="${x(clinch)}" y1="${m.t - 8}" y2="${H - m.b}" stroke="var(--accent)" stroke-width="2.5"/>`
    + `<text class="lbl" x="${x(clinch) - 4}" y="${m.t - 12}" text-anchor="end">clinch ${fmt(clinch)}</text>`;
  contenders.forEach((s, i) => {
    const y = m.t + i * rowH + rowH / 2, c = colorOf(s.car), mine = s.car === car;
    g += `<text class="lbl" x="${m.l - 8}" y="${y + 4}" text-anchor="end">#${esc(s.car)}</text>`
      + `<rect x="${m.l}" y="${y - 5}" width="${Math.max(2, x(s.points) - m.l)}" height="10" rx="3" fill="${c}"/>`
      + `<line x1="${x(s.points)}" x2="${x(s.points + left)}" y1="${y}" y2="${y}" stroke="${c}" stroke-width="2" stroke-dasharray="3 3"/>`
      + `<line x1="${x(s.points + left)}" x2="${x(s.points + left)}" y1="${y - 6}" y2="${y + 6}" stroke="${c}" stroke-width="2"/>`;
    const p = proj[s.car], r = running[s.car];
    if (p) g += `<path d="M${x(p.projected)} ${y - 8}L${x(p.projected) + 6} ${y}L${x(p.projected)} ${y + 8}L${x(p.projected) - 6} ${y}Z" fill="var(--text)" stroke="var(--surface)" stroke-width="1.5"/>`;
    const note = r ? `running P${r.class_pos}${r.in_pit ? " (pit)" : ""} · ${fmt(p?.projected ?? s.points)}` : `P${s.pos} · ${fmt(s.points)} pts${s.alive ? "" : " · out"}`;
    g += `<text x="${W - m.r + 8}" y="${y + 4}"${mine ? ' class="lbl"' : ""}>${note}</text>`;
  });
  el.insertAdjacentHTML("afterbegin", `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Cars still in contention for the ${esc(cls)} title">${g}</svg>`);
  $("fight-legend").innerHTML = `<span style="--c:var(--text-2)">bar: points now</span><span style="--c:var(--text-3)">dashed: the most it can still reach (${fmt(left)} available)</span>`
    + (clinch ? `<span style="--c:var(--accent)">clinch line: a total no rival can reach (${fmt(clinch)})</span>` : "")
    + (lc ? `<span class="sw">◆ points if the race ended now</span>` : "");
  const alive = st.filter(s => s.alive).length;
  $("fight-title").textContent = `${d.rounds_remaining > 1 ? "Championship picture" : "Still in contention"} · ${cls}`;
  $("fight-sub").innerHTML = `${alive} car${alive === 1 ? " is" : "s are"} still mathematically in the title fight with ${fmt(left)} points left`
    + (d.rounds_remaining === 1 ? " (one race: up to 350 for the win plus up to 35 for qualifying)." : ` over ${d.rounds_remaining} rounds.`)
    + (lc ? ` Live from the race, ${esc((live.remaining || "").replace(/^00:/, ""))} to go.` : "");

  // What the selected car needs. Which question that is depends on where the season stands:
  //   final round          -> what wins the title (rival by rival)
  //   can clinch next race  -> what clinches it there
  //   can be knocked out    -> what keeps it in the fight
  //   otherwise             -> no scenarios yet, just the season picture
  const ans = $("answer");
  if (!ans) return;
  const R = d.max_points_per_round, rr = d.rounds_remaining, final = rr <= 1;
  const nextName = (d.events.find(e => e.state === "upcoming")?.name || "the next round").replace(/ \(.*\)$/, "");
  const myQ = q(car), qKnown = qmap != null;
  const myTot = p => me.points + (myQ ?? 0) + racePts(p);
  const rTot = (r, p) => r.points + (q(r.car) ?? 0) + racePts(p);
  const fc = lc?.focus?.[car] || {};
  const raceLink = lc ? ` <a class="golink" href="strategy.html#${esc(car)}">Race tab →</a>` : "";
  let head, sub = "", lines = [], more = "";
  const second = st.find(s => s.car !== car);
  const others = st.filter(s => s.car !== car);
  // Every starter scores, so the worst case for a car is last place in the class, not zero.
  const fieldN = (lc ? lc.cars.length : Object.values(entries?.cars || {}).filter(e => e.class === d.class).length) || st.length;
  const lastPts = racePts(fieldN);
  const canClinch = !final && me.points + R - Math.max(...others.map(s => s.points + lastPts)) > after;
  const canLose = !final && others.some(s => s.points + R - (me.points + lastPts) > after);
  const mode = final ? "title" : canClinch ? "clinch" : canLose ? "survive" : "picture";
  if (!me.alive) {
    const myMax = me.points + left;
    const best = 1 + st.filter(s => s.car !== car && s.points > myMax).length;
    const toBeat = st.filter(s => s.car !== car && s.points <= myMax && s.pos < me.pos);
    head = best < me.pos ? `Out of the title fight. Best possible: <em>${ord(best)}</em>` : `Out of the title fight. It can't climb above ${ord(me.pos)}`;
    sub = `${fmt(me.gap)} points behind the leader with only ${fmt(left)} left.`
      + (best < me.pos ? ` To reach ${ord(best)}, #${esc(car)} needs ${rr === 1 ? "pole and the win" : "maximum points"}, and:` : "");
    if (best < me.pos) lines = toBeat.map(s => { const room = myMax - s.points, worst = RACE_POINTS.findIndex(v => v < room) + 1;
      return `<li style="--c:${colorOf(s.car)}"><b>#${esc(s.car)}</b> <span class="dim">${fmt(s.points)} pts</span> must score fewer than ${fmt(room)}${rr === 1 ? `: about ${worst ? `P${worst} or lower` : "no points at all"}` : ` in the last ${rr} rounds`}${running[s.car] ? `, running P${running[s.car].class_pos}` : ""}</li>`; });
  } else if (me.pos === 1 && me.points - (second?.points ?? 0) > left) {
    head = `<em>Champion.</em> The ${fmt(me.points - second.points)}-point lead can't be overturned`;
  } else if (mode === "picture") {
    // Too early for scenarios: the season picture and, for the leader, how far off a clinch is.
    const lead = st[0], runner = st[1], gapL = lead.points - (runner?.points ?? 0);
    // Earliest clinch for the leader: after k more races, best case it outscores 2nd by R per race.
    const k = Math.floor((rr * R - gapL) / (2 * R)) + 1;
    const upcoming = d.events.filter(e => e.state === "upcoming");
    const at = upcoming[k - 1]?.name?.replace(/ \(.*\)$/, "");
    head = me.pos === 1 ? `Leads by ${fmt(gapL)}, with ${fmt(left)} points still to play for` : `${ord(me.pos)}, ${fmt(me.gap)} behind, with ${fmt(left)} points still to play for`;
    sub = `Nobody can clinch the title or be knocked out at ${esc(nextName)}, so there's nothing to work out race by race yet. `
      + `To clinch, a car's lead has to be bigger than the points still on offer: #${esc(lead.car)} leads #${esc(runner.car)} by ${fmt(gapL)} with ${fmt(left)} left, and each round takes ${fmt(R)} off the table.`
      + (at ? ` The earliest #${esc(lead.car)} could clinch is <b>${esc(at)}</b>, and only by outscoring #${esc(runner.car)} heavily until then.` : "");
    if (lc && fc.champ_pos) {
      const margin = n => fmt(Math.abs(n ?? 0)), net = fc.basis === "net";
      head = fc.champ_pos === 1 ? `<em>Leads</em> the championship if it ends now, by ${margin(net ? fc.net_margin_behind : fc.margin_behind)} over #${esc(fc.champ_behind)}`
        : `${ord(fc.champ_pos)} in the championship if it ends now, ${margin(net ? fc.net_margin_ahead : fc.margin_ahead)} behind #${esc(fc.champ_ahead)}`;
      sub = `Running <b>P${running[car]?.class_pos ?? "–"}</b>. ` + sub + raceLink;
    }
  } else {
    // ok(diff): is a points difference over a rival good enough for this mode?
    const ok = mode === "survive" ? diff => diff >= -after : diff => diff > after;
    const goal = { title: "is champion", clinch: `clinches the title at ${esc(nextName)}`, survive: `stays in the title fight after ${esc(nextName)}` }[mode];
    const purpose = mode === "survive" ? " to stay in it" : mode === "clinch" ? " to clinch" : "";
    const rivals = (mode === "survive" ? others.filter(s => s.alive && s.points + R - (me.points + lastPts) > after) : contenders.filter(s => s.car !== car && s.alive)).slice(0, 4);
    const maxFinish = Math.max(2, fieldN);
    // Lowest finish the selected car can afford against rival r finishing rf (null: not even a win).
    const need = (r, rf) => { let worst = null;
      for (let p = 1; p <= maxFinish; p++) { if (p === rf) continue; if (ok(myTot(p) - rTot(r, rf))) worst = p; else if (p > rf) break; }
      return worst; };
    // Guaranteed: good enough against every rival's best case (the rival wins; qualifying points known, or the maximum).
    let guaranteed = null;
    for (let p = 1; p <= maxFinish; p++) {
      if (rivals.every(r => ok(myTot(p) - (r.points + (q(r.car) ?? 35) + racePts(p === 1 ? 2 : 1))))) guaranteed = p; else break;
    }
    const pre = guaranteed === 1 ? `Win${final ? " the race" : ` at ${esc(nextName)}`} and #${esc(car)} ${goal.replace(/ at .*| after .*/, "")}, whatever anyone else does`
      : guaranteed ? `Finish P${guaranteed} or better${final ? "" : ` at ${esc(nextName)}`} and #${esc(car)} ${goal.replace(/ at .*| after .*/, "")}, whatever anyone else does`
      : mode === "survive" ? `#${esc(car)} could be knocked out of the title fight at ${esc(nextName)}: it depends on the rivals`
      : mode === "clinch" ? `#${esc(car)} can clinch at ${esc(nextName)}, but only with help: it depends on where the rivals finish`
      : me.pos === 1 ? `No finish guarantees it alone: it depends on where the rivals finish` : `#${esc(car)} needs help from the cars ahead`;
    const liveNeed = lc?.worst_winning_finish?.[car];
    if (lc && fc.champ_pos) {
      const margin = n => fmt(Math.abs(n ?? 0)), net = fc.basis === "net";
      head = fc.champ_pos === 1
        ? `<em>${final ? "Champion" : "Leads"}</em> if it ends now, ${margin(net ? fc.net_margin_behind : fc.margin_behind)} ahead of #${esc(fc.champ_behind)}`
        : `${ord(fc.champ_pos)} if it ends now, ${margin(net ? fc.net_margin_ahead : fc.margin_ahead)} behind #${esc(fc.champ_ahead)}`;
      const goalNow = final ? "win the title" : "clinch the title";
      sub = `Running <b>P${running[car]?.class_pos ?? "–"}</b>. `
        + (mode === "survive" ? "" : liveNeed ? (fc.champ_pos === 1 ? `Can drop to <b>P${liveNeed}</b> and still ${goalNow} if everyone else holds position.` : `Needs <b>P${liveNeed} or better</b> to ${goalNow} if everyone else holds position.`)
          : `Can't ${goalNow} here unless cars ahead drop back.`)
        + ` Before the race: ${pre.charAt(0).toLowerCase() + pre.slice(1)}.${raceLink}`;
    } else {
      head = pre;
      sub = (me.pos === 1 ? `Leads by ${fmt(me.points - second.points)} with ${fmt(left)} points left.` : `${ord(me.pos)}, ${fmt(me.gap)} behind the leader with ${fmt(left)} points left.`)
        + (final ? "" : ` ${rr} rounds to go, ${fmt(R)} points each.`);
    }
    lines = rivals.map(r => {
      const w = need(r, 1);
      let safe = null, winVs = null;
      for (let rf = 1; rf <= maxFinish; rf++) { const n = need(r, rf); if (n != null && n >= maxFinish) { safe = rf; break; } }
      for (let rf = 2; rf <= maxFinish; rf++) if (ok(myTot(1) - rTot(r, rf))) { winVs = rf; break; }
      const who = `<b>#${esc(r.car)}</b> <span class="dim">${fmt(r.points)} pts${running[r.car] ? `, running P${running[r.car].class_pos}` : ""}</span>: `;
      let text;
      if (safe === 1) text = mode === "survive" ? `can't knock #${esc(car)} out` : `#${esc(car)} stays ahead whatever happens`;
      else {
        text = w ? `if it wins, #${esc(car)} needs P${w} or better${purpose}` : `if it wins, #${esc(car)} ${mode === "survive" ? "is out whatever it does" : `can't ${mode === "clinch" ? "clinch" : "finish ahead of it"}`}`;
        if (!w && winVs) text += `. If #${esc(car)} wins, #${esc(r.car)} must finish P${winVs} or lower`;
        else if (!w && mode === "title") text += `, and it stays ahead even if #${esc(car)} wins and it finishes last`;
        if (safe && w) text += `. If it finishes P${safe} or lower, any finish will do`;
      }
      return `<li style="--c:${colorOf(r.car)}">${who}${text}</li>`;
    });
    const cols = Array.from({ length: Math.min(10, maxFinish) }, (_, i) => i + 1);
    more = `<details class="more"><summary>Every finish, rival by rival</summary><div class="scroll"><table class="needs"><thead><tr><th class="l">If this rival finishes →</th>${cols.map(c => `<th>P${c}</th>`).join("")}</tr></thead><tbody>`
      + rivals.map(r => `<tr style="--c:${colorOf(r.car)}"><td class="l">#${esc(r.car)} <span class="dim">${fmt(r.points)} pts</span></td>`
        + cols.map(c => { const w = need(r, c), now = running[r.car]?.class_pos === c;
          return `<td class="${now ? "nowcol" : ""}">${w == null ? "✕" : w >= maxFinish ? "any" : `P${w}`}</td>`; }).join("") + `</tr>`).join("")
      + `</tbody></table></div><p class="note">Each cell is the lowest class finish #${esc(car)} can afford${purpose || " to stay ahead of that rival"} if the rival finishes there (✕ = not even a win is enough; "any" = even last of ${maxFinish} is enough). `
      + (lc ? "Highlighted: where each rival is running now. " : "") + `</p></details>`;
  }
  $("needs-mode").textContent = !me.alive || mode === "picture" || (me.pos === 1 && me.points - (second?.points ?? 0) > left) ? ""
    : { title: `What #${car} needs to win the title`, clinch: `What #${car} needs to clinch at ${nextName}`, survive: `What #${car} needs to stay in the fight at ${nextName}` }[mode];
  const qNote = me.alive && mode !== "picture" && !qKnown ? `Qualifying points aren't in yet: the rival lines leave them out, and "whatever anyone else does" assumes each rival takes the maximum 35. ` : qKnown && mode !== "picture" ? "This weekend's qualifying points are included. " : "";
  ans.innerHTML = `<p class="answer">${head}.</p>${sub ? `<p class="verdict">${sub}</p>` : ""}`
    + (lines.length ? `<ul class="needs-lines">${lines.join("")}</ul>` : "") + more
    + `<p class="note">${qNote}Ties and penalties aren't modelled.</p>`;
}

// Live championship projection during the race.
function renderProjection(d) {
  const c = raceLive(d.class), el = $("proj-card");
  el.hidden = !c;
  if (!c) return;
  const car = d.tracked[0], colorOf = colorFor(d), cls = CLASS_NAMES[d.class] || d.class;
  const fc = c.focus?.[car] || {}, proj = c.standings, me = proj.find(r => r.car === car);
  const flagKey = Object.keys(FLAG_COLORS).find(k => (live.flag || "").toLowerCase().includes(k));
  const net = fc.basis === "net";
  const ev = fc.events?.at(-1);
  const mg = n => n == null ? "–" : `${n > 0 ? "+" : n < 0 ? "−" : "±"}${Math.abs(n)}`;
  const k = (a, b, s) => `<div class="kpi"><div class="k">${a}</div><div class="v">${b}</div><div class="s">${s}</div></div>`;
  const tiles = fc.champ_pos ? [
    k("Title position", `P${fc.champ_pos}`, net ? "after pit stops" : "running order"),
    fc.champ_behind ? k(`Ahead of #${esc(fc.champ_behind)}`, `${mg(net ? fc.net_margin_behind : fc.margin_behind)}<small>pts</small>`, fc.we_hold_vs_behind ? `stays ahead finishing P${fc.we_hold_vs_behind}+` : "would lose it as it stands") : "",
    fc.champ_ahead ? k(`Behind #${esc(fc.champ_ahead)}`, `${mg(net ? fc.net_margin_ahead : fc.margin_ahead)}<small>pts</small>`, fc.we_need_vs_ahead ? `gets ahead finishing P${fc.we_need_vs_ahead}+` : "can't get ahead alone") : "",
    k("A place is worth", `+${fc.place_gain}<small>/ −${fc.place_lose}</small>`, "up one / down one"),
    fc.champ_behind ? k(`#${esc(fc.champ_behind)} needs`, fc.rival_needs ? `P${fc.rival_needs}` : "–", fc.rival_needs ? `or better to pass #${esc(car)}` : `can't pass #${esc(car)} alone`) : "",
  ].join("") : "";
  const table = `<div class="scroll"><table><thead><tr><th>Pos</th><th>Car</th><th class="l">Team</th><th>Running</th><th>This race</th><th>Total</th><th>Gap</th></tr></thead><tbody>`
    + proj.filter((r, i) => i < 6 || d.tracked.includes(r.car)).map(r => {
      const run = c.cars.find(x => x.car === r.car);
      return `<tr class="${d.tracked.includes(r.car) ? "tracked" : ""}" style="--c:${colorOf(r.car)}"><td>${r.proj_pos}</td><td>#${esc(r.car)}</td><td class="l team">${esc(r.team || run?.vehicle)}</td>
        <td>${run ? "P" + run.class_pos + (run.in_pit ? " · pit" : "") : "–"}</td><td class="dim">+${fmt(r.race_pts + r.quali_pts)}</td><td class="total">${fmt(r.projected)}</td><td class="dim">${r.proj_gap ? "−" + fmt(r.proj_gap) : "—"}</td></tr>`;
    }).join("") + `</tbody></table></div>`;
  el.classList.toggle("done", !!live.finished);
  el.innerHTML = `<div class="live-head"><span class="pulse">${live.finished ? "FINISHED" : "LIVE"}</span><b>${esc(live.event)}</b> · race · ${esc(cls)}
      <span class="flag" style="--f:${FLAG_COLORS[flagKey] || "var(--text-2)"}">${esc(live.flag)}</span>${live.finished ? "" : `<span class="ttg">${esc((live.remaining || "").replace(/^00:/, ""))} to go</span>`}</div>
    <p class="live-sub">#${esc(car)}${me && fc.champ_pos ? ` is ${ord(fc.champ_pos)} in the title if it ends like this` : " isn't in this race"}. Pit strategy and lap times: <a href="strategy.html#${esc(car)}">Race tab →</a></p>
    ${ev && ev.to ? `<p class="event">Closest title rival ${ev.role === "champ_behind" ? "behind" : "ahead"} is now <b>#${esc(ev.to)}</b>${ev.from ? ` (was #${esc(ev.from)})` : ""}, since lap ${ev.lap}.</p>` : ""}
    <div class="kpis">${tiles}</div>
    <h2 style="margin-top:16px">Championship if it finished now${net ? " (after pit stops)" : ""}</h2>${table}
    <h2 style="margin-top:16px">Title margin by lap</h2><div class="legend" id="lg-margin"></div><div class="chart" id="ch-margin"><div class="tip"></div></div>
    <p class="note">${live.finished ? "Provisional until IMSA publishes the official points. " : ""}From IMSA live timing, updated ${new Date(live.updated).toLocaleTimeString()}. `
      + `${c.quali_counted ? "Includes qualifying points. " : "Qualifying points not included. "}"After pit stops" moves back cars that still owe a stop in this pit cycle. Ties and penalties aren't modelled. Lap times and pit strategy are on the Race tab.</p>`;
  // Title margin by lap (after pit stops solid, running order dotted) against the closest rivals.
  const ml = laps?.classes?.[d.class]?.[car]?.margins || [], series = [];
  const addM = (iRaw, iNet, iCar, color, rival, word) => {
    if (!rival) return "";
    const mine = ml.filter(r => r[iCar] === rival);
    const netPts = mine.filter(r => r[iNet] != null).map(r => [r[0], r[iNet]]), rawPts = mine.filter(r => r[iRaw] != null).map(r => [r[0], r[iRaw]]);
    if (!rawPts.length) return "";
    series.push({ name: `vs #${rival} (after stops)`, pts: netPts, color, end: netPts.length ? `#${rival}` : null });
    series.push({ name: `vs #${rival} (running)`, pts: rawPts, color, dash: "1 4", width: 1.5, end: netPts.length ? null : `#${rival}` });
    return `<span style="--c:${color}">points ${word} #${esc(rival)}</span>`;
  };
  const lgB = addM(1, 2, 5, "var(--s4)", fc.champ_behind, "ahead of"), lgA = addM(3, 4, 6, "var(--s2)", fc.champ_ahead, "behind");
  lineChart("ch-margin", { series, zeroLine: true, robust: true, yFmt: v => (v > 0 ? "+" : "") + v.toFixed(0), empty: "Builds up lap by lap during the race." });
  $("lg-margin").innerHTML = lgB + lgA + `<span style="--c:var(--text-3)">solid: after pit stops · dotted: running order · above zero = ahead</span>`;
}

// Race recap: straight after the flag from live timing (provisional), otherwise the last race from
// IMSA's published results. One row per Corvette in the class.
function renderRecap(d) {
  const el = $("recap-card"), colorOf = colorFor(d), cls = CLASS_NAMES[d.class] || d.class;
  const lc = raceLive(d.class);
  const row = (car, cells) => `<tr class="${car === d.tracked[0] ? "tracked" : ""}" style="--c:${colorOf(car)}"><td>#${esc(car)}</td>${cells}</tr>`;
  if (lc && live.finished) {
    const q = quali && quali.event === live.event ? quali.classes?.[d.class] || {} : {};
    const proj = Object.fromEntries((lc.standings || []).map(r => [r.car, r]));
    const rows = d.tracked.map(car => { const r = lc.cars.find(x => x.car === car); if (!r) return "";
      const p = proj[car];
      return row(car, `<td class="total">P${r.class_pos}<span class="dim"> / ${lc.cars.length}</span></td><td>${q[car] ? "P" + q[car] : "–"}</td><td>${r.laps ?? "–"}</td><td>${esc(r.best_lap || "–")}</td><td>${r.pit_stops ?? "–"}</td><td>${p ? "+" + fmt(p.race_pts + p.quali_pts) : "–"}</td>`); }).join("");
    const top = lc.standings?.[0], me = proj[d.tracked[0]], final = lc.max_points_after === 0;
    $("recap-title").textContent = `Race result · ${live.event} · ${cls}`;
    $("recap-sub").innerHTML = top ? (final ? `<b>#${esc(top.car)} takes the ${esc(cls)} title</b>${top.car === d.tracked[0] ? " 🏆" : ""}` : `<b>#${esc(top.car)} leads the ${esc(cls)} championship</b>`)
      + (me && me.car !== top.car ? `. #${esc(me.car)} ${ord(me.proj_pos)} in the championship, ${fmt(me.proj_gap)} behind.` : ".") : "";
    $("recap").innerHTML = `<thead><tr><th>Car</th><th>Finish</th><th>Grid</th><th>Laps</th><th>Best lap</th><th>Stops</th><th>Points</th></tr></thead><tbody>${rows}</tbody>`;
    $("recap-note").textContent = "Provisional, from IMSA live timing at the flag. Official results and points follow from IMSA.";
    el.hidden = !rows;
    return;
  }
  // Between races: the latest round in the season history.
  const done = d.events.map((e, i) => ({ ...e, i })).filter(e => e.state === "done");
  const lastEv = done.at(-1);
  const rowsData = d.tracked.map(car => ({ car, h: (hist?.cars?.[car] || []).at(-1), s: d.standings.find(x => x.car === car) }))
    .filter(x => x.h && (!lastEv || x.h.round === lastEv.name || lastEv.name.startsWith(x.h.round) || x.h.round.startsWith(lastEv.name.split(" ")[0])));
  if (!rowsData.length) { el.hidden = true; return; }
  const avg = st => { const t = st.map(x => secsOf(x.time)).filter(Boolean); return t.length ? (t.reduce((a, b) => a + b) / t.length).toFixed(1) + "s" : "–"; };
  $("recap-title").textContent = `Last race · ${rowsData[0].h.round} · ${cls}`;
  const me = rowsData.find(x => x.car === d.tracked[0]);
  $("recap-sub").innerHTML = me ? `#${esc(me.car)} ${me.h.status === "Classified" ? `finished <b>P${me.h.class_pos}</b> of ${me.h.class_entries}` : esc(me.h.status)} from P${esc(me.h.grid || "–")} on the grid` : "";
  $("recap").innerHTML = `<thead><tr><th>Car</th><th>Finish</th><th>Grid</th><th>Laps</th><th>Best lap</th><th>Stops</th><th class="m-hide">Avg stop</th><th>Points</th></tr></thead><tbody>`
    + rowsData.map(({ car, h, s }) => row(car, `<td class="total">${h.status === "Classified" ? "P" + h.class_pos : esc(h.status)}<span class="dim"> / ${h.class_entries}</span></td><td>${h.grid ? "P" + h.grid : "–"}</td><td>${h.laps}</td>
      <td>${esc(h.best_lap || "–")}${h.best_lap_rank ? `<span class="dim m-hide"> (${ord(h.best_lap_rank)})</span>` : ""}</td><td>${h.stops.length}</td><td class="dim m-hide">${avg(h.stops)}</td>
      <td>${s && lastEv ? fmt(roundPts(s.rounds[lastEv.i])) : "–"}</td>`)).join("") + `</tbody>`;
  $("recap-note").textContent = "From IMSA's official race results.";
  el.hidden = false;
}

// Small line chart (one y axis) with a crosshair tooltip.
function lineChart(id, { series, yFmt = v => v.toFixed(1), zeroLine = false, robust = false, empty = "No data yet." }) {
  const el = $(id), tip = el.querySelector(".tip");
  el.querySelector("svg")?.remove(); el.querySelector(".empty")?.remove();
  const pts = series.flatMap(s => s.pts);
  if (pts.length < 2) { el.insertAdjacentHTML("afterbegin", `<p class="empty">${empty}</p>`); return; }
  const W = Math.max(300, el.clientWidth), H = 200, m = { t: 10, r: 54, b: 24, l: 50 }, iw = W - m.l - m.r, ih = H - m.t - m.b;
  const xs = pts.map(p => p[0]), x0 = Math.min(...xs), x1 = Math.max(...xs, x0 + 1);
  const ys = pts.map(p => p[1]).sort((a, b) => a - b), qn = f => ys[Math.round(f * (ys.length - 1))];
  let [y0, y1] = robust ? [qn(0.02), qn(0.98)] : [ys[0], ys.at(-1)];
  if (y1 - y0 < 1e-6) { y0 -= 1; y1 += 1; }
  const pad = (y1 - y0) * 0.08; y0 -= pad; y1 += pad;
  const x = v => m.l + (v - x0) / (x1 - x0) * iw, y = v => m.t + ih - (Math.max(y0, Math.min(y1, v)) - y0) / (y1 - y0) * ih;
  let g = "";
  for (let i = 0; i <= 4; i++) { const v = y0 + (y1 - y0) * i / 4; g += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)"/><text x="${m.l - 6}" y="${y(v) + 4}" text-anchor="end">${yFmt(v)}</text>`; }
  if (zeroLine && y0 < 0 && y1 > 0) g += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(0)}" y2="${y(0)}" stroke="var(--text-3)" stroke-dasharray="2 3"/>`;
  const stepX = Math.max(1, Math.ceil((x1 - x0) / Math.floor(iw / 48)));
  for (let v = Math.ceil(x0); v <= x1; v += stepX) g += `<text x="${x(v)}" y="${H - 6}" text-anchor="middle">${v}</text>`;
  let lines = "", labels = "";
  for (const s of series) {
    if (!s.pts.length) continue;
    lines += `<polyline fill="none" stroke="${s.color}" stroke-width="${s.width || 2}" ${s.dash ? `stroke-dasharray="${s.dash}"` : ""} stroke-linejoin="round" points="${s.pts.map(p => `${x(p[0])},${y(p[1])}`).join(" ")}"/>`;
    if (s.end) { const p = s.pts.at(-1); labels += `<text class="lbl" x="${x(p[0]) + 6}" y="${y(p[1]) + 4}">${esc(s.end)}</text>`; }
  }
  el.insertAdjacentHTML("afterbegin", `<svg viewBox="0 0 ${W} ${H}" role="img">${g}${lines}${labels}<rect class="hit" x="${m.l}" y="${m.t}" width="${iw}" height="${ih}" fill="transparent"/></svg>`);
  const svg = el.querySelector("svg"), named = series.filter(s => s.name);
  svg.querySelector(".hit").addEventListener("pointermove", ev => {
    const r = svg.getBoundingClientRect(), v = Math.round(x0 + ((ev.clientX - r.left) * W / r.width - m.l) / iw * (x1 - x0));
    tip.innerHTML = `<b>Lap ${v}</b>` + named.map(s => { const p = s.pts.find(q => q[0] === v); return `<div><span><i style="--c:${s.color}"></i>${esc(s.name)}</span><span>${p ? yFmt(p[1]) : "–"}</span></div>`; }).join("");
    tip.style.display = "block"; tip.style.left = Math.min(x(v) / W * r.width + 12, r.width - tip.offsetWidth) + "px"; tip.style.top = "8px";
  });
  svg.querySelector(".hit").addEventListener("pointerleave", () => { tip.style.display = "none"; });
}

function drawChart(series, done, colorOf) {
  const el = $("chart");
  el.querySelector("svg")?.remove();
  chartWidth = el.clientWidth;
  const W = Math.max(320, el.clientWidth), H = W < 600 ? 240 : 320, m = { t: 12, r: 40, b: 28, l: 40 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const max = Math.max(50, ...series.flatMap(x => x.gap));
  const step = max > 400 ? 100 : max > 200 ? 50 : 25;
  const top = Math.ceil(max / step) * step;
  const x = i => m.l + (done.length === 1 ? iw / 2 : (i / (done.length - 1)) * iw);
  const y = v => m.t + (v / top) * ih;   // 0 behind = top of the chart
  let g = "";
  for (let v = 0; v <= top; v += step)
    g += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)"/>`
      + `<text x="${m.l - 8}" y="${y(v) + 4}" text-anchor="end">${v ? "−" + fmt(v) : "Lead"}</text>`;
  const every = Math.ceil(done.length / Math.floor(iw / 64));
  done.forEach((e, i) => { if (i % every === 0 || i === done.length - 1) g += `<text x="${x(i)}" y="${H - 6}" text-anchor="middle">${esc(e.name.split(" ")[0])}</text>`; });
  let lines = "", labels = "";
  for (const { s, gap } of series) {
    const c = colorOf(s.car), w = s.tracked ? 2.5 : 1.5;
    lines += `<polyline fill="none" stroke="${c}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round" points="${gap.map((v, i) => `${x(i)},${y(v)}`).join(" ")}"/>`;
    if (s.tracked) {
      const lx = x(gap.length - 1), ly = y(gap.at(-1));
      lines += `<circle cx="${lx}" cy="${ly}" r="4" fill="${c}" stroke="var(--surface)" stroke-width="2"/>`;
      labels += `<text class="lbl" x="${lx + 10}" y="${ly + 4}">#${esc(s.car)}</text>`;
    }
  }
  el.insertAdjacentHTML("afterbegin", `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Points behind the championship leader after each round">${g}${lines}${labels}
    <line id="xh" y1="${m.t}" y2="${m.t + ih}" stroke="var(--text-3)" stroke-dasharray="3 3" visibility="hidden"/>
    <rect x="${m.l}" y="${m.t}" width="${iw}" height="${ih}" fill="transparent" id="hit"/></svg>`);

  // Crosshair + tooltip: snap to nearest round, list the tracked cars and the top of the field.
  const svg = el.querySelector("svg"), tip = $("tip"), xh = svg.querySelector("#xh");
  const move = ev => {
    const r = svg.getBoundingClientRect();
    const px = (ev.clientX - r.left) * (W / r.width);
    const i = Math.max(0, Math.min(done.length - 1, Math.round((px - m.l) / iw * (done.length - 1))));
    xh.setAttribute("x1", x(i)); xh.setAttribute("x2", x(i)); xh.setAttribute("visibility", "visible");
    const atRound = [...series].sort((a, b) => b.pts[i] - a.pts[i]);
    const rows = atRound.filter((t, k) => t.s.tracked || k < 3);
    tip.innerHTML = `<b>After ${esc(done[i].name)}</b>` + rows.map(t =>
      `<div><span><i style="--c:${colorOf(t.s.car)}"></i>P${atRound.indexOf(t) + 1} #${esc(t.s.car)}</span><span>${fmt(t.pts[i])}${t.gap[i] ? ` <small>−${fmt(t.gap[i])}</small>` : ""}</span></div>`).join("");
    tip.style.display = "block";
    const left = x(i) / W * r.width;
    tip.style.left = Math.min(left + 12, r.width - tip.offsetWidth) + "px";
    tip.style.top = "8px";
  };
  const hide = () => { tip.style.display = "none"; xh.setAttribute("visibility", "hidden"); };
  const hit = svg.querySelector("#hit");
  hit.addEventListener("pointermove", move);
  hit.addEventListener("pointerleave", hide);
}

load();
</script>
<script src="countdown.js" defer></script>
</body>
