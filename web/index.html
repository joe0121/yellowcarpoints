<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yellow Car Points</title>
<meta name="description" content="Live IMSA WeatherTech championship standings for the Corvette Racing entries.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23eda100'/><text x='16' y='23' font-size='18' font-family='Arial' font-weight='700' text-anchor='middle' fill='%23111'>4</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Inter:wght@400;500;600&display=swap">
<style>
:root {
  color-scheme: light;
  --bg: #f5f4f0;
  --surface: #fcfcfb;
  --line: #e2e0d9;
  --grid: #ebe9e3;
  --text: #0b0b0b;
  --text-2: #52514e;
  --text-3: #7a7974;
  --accent: #eda100;          /* Corvette yellow, series slot 1 */
  --accent-ink: #8a5d00;
  --series-2: #2a78d6;
  --context: #c9c7c0;
  --good: #0ca30c;
  --critical: #d03b3b;
  --row-hl: #fdf3dc;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #111110;
    --surface: #1a1a19;
    --line: #2e2e2b;
    --grid: #262624;
    --text: #ffffff;
    --text-2: #c3c2b7;
    --text-3: #8f8e86;
    --accent: #eda100;
    --accent-ink: #f5c04a;
    --series-2: #3987e5;
    --context: #46463f;
    --row-hl: #2a2414;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #111110; --surface: #1a1a19; --line: #2e2e2b; --grid: #262624;
  --text: #ffffff; --text-2: #c3c2b7; --text-3: #8f8e86;
  --accent: #eda100; --accent-ink: #f5c04a; --series-2: #3987e5;
  --context: #46463f; --row-hl: #2a2414;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.5 Inter, system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}
main { max-width: 1040px; margin: 0 auto; padding: 24px 16px 48px; }
h1, h2, .num { font-family: Oswald, Impact, sans-serif; font-weight: 600; letter-spacing: .01em; }
header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 8px 24px; margin-bottom: 20px; }
h1 { margin: 0; font-size: clamp(28px, 6vw, 40px); line-height: 1.05; text-transform: uppercase; }
h1 span { color: var(--accent); }
.sub { color: var(--text-2); margin: 4px 0 0; }
.meta { color: var(--text-3); font-size: 13px; text-align: right; }
.badge { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: 12px; font-weight: 600; border: 1px solid var(--line); color: var(--text-2); }
.badge.prov { border-color: var(--accent); color: var(--accent-ink); }

.cars { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; margin-bottom: 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px; }
.car { border-top: 4px solid var(--c); }
.car-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.car-no { font-family: Oswald, sans-serif; font-weight: 600; font-size: 20px; }
.car-no i { font-style: normal; display: inline-block; width: 10px; height: 10px; border-radius: 3px; background: var(--c); margin-right: 8px; }
.drivers { color: var(--text-2); font-size: 13px; }
.hero { display: flex; align-items: baseline; gap: 20px; margin: 10px 0 6px; flex-wrap: wrap; }
.pos { font-size: 64px; line-height: 1; }
.pts { font-size: 28px; line-height: 1; }
.pts small { font-family: Inter, sans-serif; font-size: 13px; font-weight: 500; color: var(--text-3); margin-left: 4px; }
.facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
.facts div { font-size: 12px; color: var(--text-3); }
.facts b { display: block; font-family: Oswald, sans-serif; font-weight: 500; font-size: 20px; color: var(--text); }
.verdict { margin-top: 12px; font-size: 14px; color: var(--text-2); }
.verdict strong { color: var(--text); }
.status { font-weight: 600; }
.status::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: currentColor; vertical-align: 1px; }

h2 { font-size: 18px; text-transform: uppercase; margin: 0 0 4px; }
.card + .card, .cars + .card { margin-top: 16px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--text-2); margin: 4px 0 8px; }
.legend span::before { content: ""; display: inline-block; width: 14px; height: 2px; background: var(--c); vertical-align: middle; margin-right: 6px; }
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { font: 11px Inter, sans-serif; fill: var(--text-3); }
.chart .lbl { font-weight: 600; fill: var(--text); }
.tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 12px; box-shadow: 0 4px 16px rgb(0 0 0 / .15); min-width: 170px; display: none; }
.tip b { display: block; margin-bottom: 4px; }
.tip small { color: var(--text-3); font-size: 11px; }
.tip div { display: flex; justify-content: space-between; gap: 12px; }
.tip i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; background: var(--c); }

.scroll { overflow-x: auto; margin: 8px -20px -20px; padding: 0 20px 12px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
th, td { padding: 7px 8px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line); }
th { font-weight: 500; color: var(--text-3); font-size: 11px; text-transform: uppercase; letter-spacing: .03em; }
th.l, td.l { text-align: left; }
td.team { color: var(--text-2); }
td.team div { color: var(--text-3); font-size: 12px; }
tr.tracked td { background: var(--row-hl); }
tr.tracked td:first-child { box-shadow: inset 4px 0 var(--c); }
td.total { font-weight: 600; }
td.dim { color: var(--text-3); }
th.rnd, td.rnd { color: var(--text-2); min-width: 44px; }
footer { margin-top: 24px; color: var(--text-3); font-size: 12px; }
footer a { color: inherit; }
.err { padding: 40px 20px; text-align: center; color: var(--text-2); }

.live { border: 1px solid var(--accent); margin-bottom: 16px; }
.live-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; font-size: 13px; color: var(--text-2); }
.live-head b { color: var(--text); }
.pulse { font-weight: 700; letter-spacing: .08em; color: var(--critical); }
.pulse::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: currentColor; margin-right: 6px; vertical-align: 1px; animation: blink 1.4s infinite; }
.live.done .pulse { color: var(--text-3); }
.live.done .pulse::before { animation: none; }
@keyframes blink { 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .pulse::before { animation: none; } }
.flag { padding: 1px 8px; border-radius: 99px; font-size: 12px; font-weight: 600; border: 1px solid var(--f); color: var(--f); }
.ttg { margin-left: auto; font-variant-numeric: tabular-nums; }
.live-verdict { font-family: Oswald, Impact, sans-serif; font-weight: 600; font-size: clamp(22px, 4.5vw, 30px); line-height: 1.15; margin: 12px 0 4px; text-transform: uppercase; }
.live-verdict em { font-style: normal; color: var(--accent-ink); }
.live-sub { margin: 0; color: var(--text-2); font-size: 14px; }
.runners { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; margin: 16px 0 4px; }
.runner { border-left: 4px solid var(--c); padding: 2px 0 2px 12px; }
.runner-top { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.runner-top .num { font-size: 28px; line-height: 1; }
.runner-top small { color: var(--text-3); font-size: 12px; }
.pit { font-size: 11px; font-weight: 700; padding: 0 6px; border-radius: 4px; background: var(--accent); color: #111; }
.runner dl { display: grid; grid-template-columns: repeat(4, auto); gap: 2px 14px; margin: 8px 0 0; font-size: 12px; justify-content: start; }
.runner dt { color: var(--text-3); }
.runner dd { margin: 0; font-variant-numeric: tabular-nums; font-weight: 500; }
.picker { display: flex; flex-wrap: wrap; gap: 8px 20px; margin: -4px 0 16px; }
.picker div { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.picker span { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--text-3); margin-right: 2px; }
.picker a { font: 600 15px Oswald, sans-serif; text-decoration: none; color: var(--text-2); border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 3px 12px; }
.picker a:hover { border-color: var(--text-3); }
.picker a[aria-current] { background: var(--accent); border-color: var(--accent); color: #111; }
.stint { margin-top: 10px; font-size: 12px; color: var(--text-2); }
.bar { position: relative; height: 8px; border-radius: 4px; background: var(--grid); margin: 6px 0 4px; overflow: hidden; }
.bar .fill { position: absolute; inset: 0 auto 0 0; background: var(--c); border-radius: 4px; }
.bar .win { position: absolute; top: 0; bottom: 0; background: color-mix(in srgb, var(--critical) 25%, transparent); }
.bar .typ { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--critical); }
.stint b { color: var(--text); font-weight: 600; }
td.stints { color: var(--text-3); font-size: 12px; white-space: normal; min-width: 120px; text-align: left; }
.up { color: var(--good); }
.down { color: var(--critical); }
table.timing td.team div { white-space: nowrap; }
.live .note { color: var(--text-3); font-size: 12px; margin: 10px 0 0; }
@media (max-width: 560px) {
  .meta { text-align: left; }
  .pos { font-size: 52px; }
  .rnd { display: none; }
  td.team { white-space: normal; min-width: 140px; }
  th, td { padding: 7px 5px; }
}
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Yellow Car <span>Points</span></h1>
      <p class="sub" id="sub">IMSA WeatherTech SportsCar Championship</p>
    </div>
    <div class="meta" id="meta"></div>
  </header>
  <nav class="picker" id="picker" aria-label="Choose a Corvette"></nav>
  <section class="card live" id="live" hidden aria-live="polite"></section>
  <section class="cars" id="cars"></section>
  <section class="card" id="chart-card" hidden>
    <h2>Points behind the leader</h2>
    <div class="legend" id="legend"></div>
    <div class="chart" id="chart"><div class="tip" id="tip"></div></div>
  </section>
  <section class="card" id="table-card" hidden>
    <h2 id="table-title">Standings</h2>
    <div class="scroll"><table id="table"></table></div>
  </section>
  <section class="card" id="hist-card" hidden>
    <h2 id="hist-title">Race by race</h2>
    <div class="scroll"><table id="hist"></table></div>
  </section>
  <footer id="foot"></footer>
</main>
<script>
const CLASS_NAMES = { GTDPRO: "GTD PRO", GTD: "GTD", GTP: "GTP", LMP2: "LMP2" };
const COLORS = ["var(--accent)", "var(--series-2)"];
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = n => n.toLocaleString("en-US");
const ord = n => n + (["th", "st", "nd", "rd"][(n % 100 - 20) % 10] || ["th", "st", "nd", "rd"][n % 100] || "th");
const roundPts = r => r ? (r.q || 0) + (r.r || 0) : 0;
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
                set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };

let standings = null, live = null, hist = null;

// The selected car comes from the URL (#13), then the last choice, then the first configured car.
function selected() {
  const cars = standings.cars;
  const want = location.hash.slice(1) || store.get("car");
  return cars.find(c => c.car === want) || cars[0];
}

// One class's standings, shaped for rendering: tracked[0] is the selected car,
// the rest are the other Corvettes in that class.
function view(sel) {
  const c = standings.classes[sel.class];
  const others = standings.cars.filter(x => x.class === sel.class && x.car !== sel.car).map(x => x.car);
  return { ...c, class: sel.class, tracked: [sel.car, ...others],
    season: standings.season, event: standings.event, status: standings.status, url: standings.url, updated: standings.updated };
}

function colorFor(d) {
  return car => { const i = d.tracked.indexOf(car); return i < 0 ? "var(--context)" : COLORS[Math.min(i, 1)]; };
}

async function getJSON(path) {
  try {
    const res = await fetch(path, { cache: "no-cache" });
    return res.ok ? await res.json() : null;
  } catch (e) { return null; }
}

async function load() {
  [standings, hist] = await Promise.all([getJSON("data/standings.json"), getJSON("data/history.json")]);
  if (!standings || !standings.classes) {
    $("cars").innerHTML = `<div class="card err">Standings aren't available yet. Check back shortly.</div>`;
    return;
  }
  await loadLive();
  renderAll();
}

function renderAll() {
  const sel = selected();
  store.set("car", sel.car);
  const groups = {};
  standings.cars.forEach(c => (groups[c.class] ||= []).push(c.car));
  $("picker").innerHTML = Object.entries(groups).map(([cls, cars]) => `<div><span>${esc(CLASS_NAMES[cls] || cls)}</span>`
    + cars.map(c => `<a href="#${esc(c)}"${c === sel.car ? ' aria-current="true"' : ""}>#${esc(c)}</a>`).join("") + `</div>`).join("");
  const d = view(sel);
  render(d);
  renderHistory(sel, d);
  renderLiveCard(d);
}
addEventListener("hashchange", () => standings && renderAll());

function render(d) {
  const cls = CLASS_NAMES[d.class] || d.class;
  const colorOf = colorFor(d);
  const st = d.standings;
  const next = d.events.find(e => e.state === "upcoming");
  const done = d.events.map((e, i) => ({ ...e, i })).filter(e => e.state === "done");
  const car = d.tracked[0];

  document.title = `Yellow Car Points · #${car} ${cls}`;
  $("sub").textContent = `${d.season} IMSA WeatherTech SportsCar Championship · ${cls}`;
  $("meta").innerHTML = `After <b>${esc(d.event)}</b> <span class="badge ${d.status === "Official" ? "" : "prov"}">${esc(d.status)}</span><br>`
    + (next ? `Next: ${esc(next.name)} · ` : "Season complete · ")
    + `${d.rounds_remaining} round${d.rounds_remaining === 1 ? "" : "s"} left`;

  // --- hero card for the selected car
  const t = st.find(s => s.car === car);
  if (!t) {
    $("cars").innerHTML = `<div class="card car" style="--c:${colorOf(car)}"><div class="car-no"><i></i>#${esc(car)}</div>
      <p class="verdict">Not scored in the ${d.season} ${cls} team standings. Live timing and pit windows still show here when it races.</p></div>`;
  } else {
    const ahead = st.find(s => s.pos === t.pos - 1), behind = st.find(s => s.pos === t.pos + 1);
    const left = d.max_points_remaining;
    let status, color, verdict;
    if (t.pos === 1) {
      const lead = behind ? t.points - behind.points : t.points;
      if (lead > left) {
        [status, color] = ["Champions", "var(--good)"];
        verdict = `Title clinched. The ${fmt(lead)}-point lead can't be overturned.`;
      } else {
        [status, color] = ["Leading", "var(--accent-ink)"];
        verdict = `Leads by <strong>${fmt(lead)}</strong> with ${fmt(left)} still available. `
          + (behind ? `#${esc(behind.car)} ${esc(behind.team)} is the closest threat.` : "");
      }
    } else if (t.alive) {
      [status, color] = ["In contention", "var(--accent-ink)"];
      verdict = `<strong>${fmt(t.gap)}</strong> behind the leader with ${fmt(left)} still available.`;
    } else {
      [status, color] = ["Out of title contention", "var(--text-3)"];
      verdict = `${fmt(t.gap)} behind with only ${fmt(left)} left. Fighting for ${ord(t.pos)}.`;
    }
    const best = Math.max(...t.rounds.map(roundPts));
    $("cars").innerHTML = `<article class="card car" style="--c:${colorOf(car)}">
      <div class="car-head"><div class="car-no"><i></i>#${esc(car)} <small class="drivers">${esc(t.team)}</small></div><span class="status" style="color:${color}">${status}</span></div>
      <div class="drivers">${esc(t.drivers.join(" · "))}</div>
      <div class="hero"><span class="num pos">P${t.pos}</span><span class="num pts">${fmt(t.points)}<small>pts</small></span></div>
      <p class="verdict">${verdict}</p>
      <div class="facts">
        <div>To car ahead<b>${ahead ? "−" + fmt(ahead.points - t.points) : "—"}</b></div>
        <div>To car behind<b>${behind ? "+" + fmt(t.points - behind.points) : "—"}</b></div>
        <div>Best round<b>${fmt(best)}</b></div>
      </div>
    </article>`;
  }

  // --- chart: cumulative points by completed round
  $("chart-card").hidden = done.length < 2;
  if (done.length > 1) {
    const cum = s => { let sum = 0; return done.map(e => (sum += roundPts(s.rounds[e.i]))); };
    const all = st.map(s => ({ s, total: cum(s) }));
    const lead = done.map((e, i) => Math.max(...all.map(a => a.total[i])));
    const series = all.filter(a => d.tracked.includes(a.s.car) || a.s.pos <= 8)
      .map(a => ({ s: { ...a.s, tracked: d.tracked.includes(a.s.car) }, pts: a.total, gap: a.total.map((v, i) => lead[i] - v) }));
    // Context first, then other Corvettes, then the selected car on top.
    const rank = s => s.car === car ? 2 : s.tracked ? 1 : 0;
    series.sort((a, b) => rank(a.s) - rank(b.s));
    drawState = { series, done, colorOf };
    drawChart(series, done, colorOf);
    const others = d.tracked.slice(1).filter(c => st.some(s => s.car === c));
    $("legend").innerHTML = `<span style="--c:${colorOf(car)}">#${esc(car)}</span>`
      + (others.length ? `<span style="--c:${COLORS[1]}">Other Corvettes (${others.map(c => "#" + esc(c)).join(", ")})</span>` : "")
      + `<span style="--c:var(--context)">Rest of top 8</span>`;
  }

  // --- standings table
  $("table-title").textContent = `${cls} team standings`;
  $("table").innerHTML = `<thead><tr><th>Pos</th><th>Car</th><th class="l">Team</th><th>Pts</th><th>Gap</th>`
    + done.map(e => `<th class="rnd" title="${esc(e.name)}">${esc(e.name.split(" ")[0].slice(0, 4))}</th>`).join("")
    + `</tr></thead><tbody>`
    + st.map(s => `<tr class="${d.tracked.includes(s.car) ? "tracked" : ""}" style="--c:${colorOf(s.car)}">
        <td>${s.pos}</td><td>#${esc(s.car)}</td>
        <td class="l team">${esc(s.team)}<div>${esc(s.drivers.join(" · "))}</div></td>
        <td class="total">${fmt(s.points)}</td><td class="dim">${s.gap ? "−" + fmt(s.gap) : "—"}</td>`
      + done.map(e => { const r = s.rounds[e.i]; return `<td class="rnd">${r && (r.q !== null || r.r !== null) ? roundPts(r) : "–"}</td>`; }).join("")
      + `</tr>`).join("") + `</tbody>`;
  $("table-card").hidden = false;

  $("foot").innerHTML = `Data: <a href="${esc(d.url)}" rel="noopener">IMSA championship points (${esc(d.status)})</a>, race reports and live timing via Al Kamel. `
    + `Checked ${new Date(d.updated).toLocaleString()}. Unofficial fan site, not affiliated with IMSA, GM or Corvette Racing.`;
}

let drawState = null, chartWidth = 0;
addEventListener("resize", () => {
  if (drawState && $("chart").clientWidth !== chartWidth) drawChart(drawState.series, drawState.done, drawState.colorOf);
});

// --- season history (data/history.json, from Al Kamel race reports)
function renderHistory(sel, d) {
  const rows = (hist?.cars?.[sel.car] || []).slice().reverse();
  $("hist-card").hidden = !rows.length;
  if (!rows.length) return;
  $("hist-title").textContent = `#${sel.car} race by race`;
  const avg = stops => { const t = stops.map(s => secsOf(s.time)).filter(Boolean); return t.length ? (t.reduce((a, b) => a + b) / t.length).toFixed(1) + "s" : "–"; };
  $("hist").innerHTML = `<thead><tr><th class="l">Race</th><th>Finish</th><th>Grid</th><th>Laps</th><th>Best lap</th><th>Stops</th><th>Avg stop</th><th class="l">Stints (laps)</th><th class="l">Drivers (laps)</th></tr></thead><tbody>`
    + rows.map(r => `<tr>
        <td class="l">${esc(r.round)}</td>
        <td class="total">${r.status === "Classified" ? `P${r.class_pos}` : esc(r.status)}<span class="dim"> / ${r.class_entries}</span></td>
        <td>${r.grid ? "P" + r.grid : "–"}</td><td>${r.laps}</td>
        <td>${esc(r.best_lap || "–")}${r.best_lap_rank ? `<span class="dim"> (${ord(r.best_lap_rank)})</span>` : ""}</td>
        <td>${r.stops.length}</td><td class="dim">${avg(r.stops)}</td>
        <td class="stints">${r.stints.join(" · ")}</td>
        <td class="l stints">${r.drivers.map(x => `${esc(x.name)} ${x.laps}`).join(" · ")}</td></tr>`).join("")
    + `</tbody>`;
}
const secsOf = t => { if (!t) return null; let s = 0; for (const p of String(t).split(":")) s = s * 60 + parseFloat(p); return s; };

// --- live timing (data/live.json + data/laps.json, written by the scraper during WeatherTech sessions)
const FLAG_COLORS = { green: "var(--good)", yellow: "var(--accent-ink)", fcy: "var(--accent-ink)", red: "var(--critical)" };
let laps = null;
const lapTime = t => t == null ? "–" : `${Math.floor(t / 60)}:${(t % 60).toFixed(1).padStart(4, "0")}`;
const signed = (v, unit = "s") => v == null ? "–" : `${v > 0 ? "+" : v < 0 ? "−" : "±"}${Math.abs(v).toFixed(2)}${unit}`;

async function loadLive() {
  live = await getJSON("data/live.json");
  laps = live ? await getJSON("data/laps.json") : null;
}

function liveFresh(cls) {
  if (!live || !live.classes || !live.classes[cls]) return false;
  const age = Date.now() - new Date(live.updated);
  // A race stays up until the official points include it; other sessions only while they run.
  return live.is_race ? live.base_event === standings.event && age < 48 * 3600e3 : age < 30 * 60e3;
}

function renderLiveCard(d) {
  const fresh = liveFresh(d.class);
  $("live").hidden = !fresh;
  if (fresh) renderLive(live, live.classes[d.class], d);
}
setInterval(async () => { if (!standings) return; await loadLive(); renderLiveCard(view(selected())); }, 30e3);

function stintHTML(s) {
  if (!s) return "";
  if (s.laps === null) return `<div class="stint">Stint length known after the next pit stop.</div>`;
  if (!s.typical) return `<div class="stint">Stint lap <b>${s.laps}</b></div>`;
  const max = Math.max(s.window_close, s.laps) * 1.05, w = v => (v / max * 100).toFixed(1) + "%";
  let msg;
  if (s.laps_to_window > 0) msg = `window opens in <b>${s.laps_to_window}</b> laps`;
  else if (s.laps_to_typical > 0) msg = `stop expected in ~<b>${s.laps_to_typical}</b> laps` + (s.eta_min ? ` (~${s.eta_min} min)` : "");
  else if (s.laps <= s.window_close) msg = `<b>in the window</b>, stop due`;
  else msg = `<b>past a normal stint</b> (fuel saving or a yellow)`;
  return `<div class="stint">Stint lap <b>${s.laps}</b> · window ${s.window_open}–${s.window_close} · ${msg}
    <div class="bar" role="img" aria-label="Stint lap ${s.laps} of a typical ${s.typical}"><div class="win" style="left:${w(s.window_open)};width:calc(${w(s.window_close)} - ${w(s.window_open)})"></div>
    <div class="fill" style="width:${w(s.laps)}"></div><div class="typ" style="left:${w(s.typical)}"></div></div></div>`;
}

function strategyHTML(x) {
  if (!x || !x.pace) return "";
  const trend = x.trend == null ? "" : x.trend < -0.05 ? ` <span class="up">▲ ${Math.abs(x.trend).toFixed(2)}s quicker</span>`
    : x.trend > 0.05 ? ` <span class="down">▼ ${x.trend.toFixed(2)}s slower</span>` : " · steady";
  return `<div class="stint">Pace <b>${lapTime(x.pace)}</b> (last 5 clean laps)${trend}`
    + (x.vs_ahead != null ? ` · vs car ahead <b>${signed(x.vs_ahead)}</b>/lap` : "")
    + (x.rejoin ? ` · pits now → rejoins ~<b>P${x.rejoin}</b>` : "") + `</div>`;
}

function renderLive(l, c, d) {
  const colorOf = colorFor(d);
  const car = d.tracked[0];
  const cls = CLASS_NAMES[d.class] || d.class;
  const flagKey = Object.keys(FLAG_COLORS).find(k => (l.flag || "").toLowerCase().includes(k));
  const left = (l.remaining || "").replace(/^00:/, "");
  const sess = l.session.replace(/^WeatherTech Championship( - )?/, "") || "Session";
  const strat = c.strategy?.cars || {};
  const mine = c.cars.find(r => r.car === car);

  // --- headline: championship projection in the race, timing otherwise
  let verdict = "", sub = "";
  const proj = c.standings || [];
  const me = proj.find(r => r.car === car);
  if (l.is_race && me && mine && c.worst_winning_finish[car] !== undefined) {
    const final = c.max_points_after === 0, worst = c.worst_winning_finish[car];
    if (me.proj_pos === 1) {
      verdict = `#${esc(car)} <em>${final ? "champion" : "championship leader"}</em> by ${fmt(me.projected - proj[1].projected)} if it ends like this`;
      sub = worst ? `Can finish as low as <strong>P${worst}</strong> in class and still ${final ? "win the title" : "clinch"}, if everyone else holds position.`
        : final ? "" : `Not enough to clinch yet: ${fmt(c.max_points_after)} points still to come after this race.`;
    } else {
      verdict = `#${esc(proj[0].car)} ${final ? "takes the title" : "leads"} · #${esc(car)} P${me.proj_pos}, ${fmt(me.proj_gap)} back`;
      sub = worst ? `#${esc(car)} needs <strong>P${worst}</strong> or better in class, with everyone else holding position.`
        : `#${esc(car)} can't reach the top from here unless cars ahead drop back. Projected ${ord(me.proj_pos)} in the championship.`;
    }
  } else if (mine) {
    verdict = `#${esc(car)} P${mine.class_pos} in ${esc(cls)}` + (mine.best_lap ? ` · best ${esc(mine.best_lap)}` : "");
  } else {
    verdict = `#${esc(car)} isn't in this session`;
  }

  // --- the Corvettes in this class
  const runners = d.tracked.map(t => c.cars.find(r => r.car === t)).filter(Boolean).map(x => `
    <div class="runner" style="--c:${colorOf(x.car)}">
      <div class="runner-top"><span class="num">#${esc(x.car)} P${x.class_pos}</span><small>in class · ${esc(x.driver)}</small>${x.in_pit ? `<span class="pit">IN PIT</span>` : ""}</div>
      <dl><dt>Gap</dt><dt>Last lap</dt><dt>Best lap</dt><dt>Stops</dt>
        <dd>${x.class_pos === 1 ? "Leader" : esc(x.gap)}</dd><dd>${esc(x.last_lap)}</dd><dd>${esc(x.best_lap)}</dd><dd>${x.pit_stops ?? "–"}</dd></dl>
      ${strategyHTML(strat[x.car])}${stintHTML(x.stint)}
    </div>`).join("");

  // --- whole-class timing
  const timing = `<div class="scroll"><table class="timing"><thead><tr><th>Pos</th><th>Car</th><th class="l">Driver</th><th>Laps</th><th>Gap</th><th>Last</th><th>Best</th><th>Pace</th><th>Trend</th>${l.is_race ? "<th>Stint</th>" : ""}<th>Stops</th>${l.is_race ? `<th title="Estimated class position after a stop now">Pit now</th>` : ""}</tr></thead><tbody>`
    + c.cars.map(r => { const x = strat[r.car] || {};
      return `<tr class="${d.tracked.includes(r.car) ? "tracked" : ""}" style="--c:${colorOf(r.car)}">
        <td>${r.class_pos}</td><td>#${esc(r.car)}</td><td class="l team">${esc(r.driver)}${r.in_pit ? ` <span class="pit">PIT</span>` : ""}<div>${esc(r.vehicle)}</div></td>
        <td>${r.laps ?? "–"}</td><td class="dim">${r.class_pos === 1 ? "—" : esc(r.gap)}</td><td>${esc(r.last_lap)}</td><td>${esc(r.best_lap)}</td>
        <td>${lapTime(x.pace)}</td><td class="${x.trend < -0.05 ? "up" : x.trend > 0.05 ? "down" : "dim"}">${signed(x.trend)}</td>
        ${l.is_race ? `<td class="dim">${r.stint?.laps ?? "–"}</td>` : ""}<td class="dim">${r.pit_stops ?? "–"}</td>${l.is_race ? `<td class="dim">${x.rejoin ? "P" + x.rejoin : "–"}</td>` : ""}</tr>`; }).join("")
    + `</tbody></table></div>`;

  // --- championship if it finished now (race only)
  const projTable = proj.length ? `<h2 style="margin-top:20px">Championship if it finished now</h2><div class="scroll"><table><thead><tr><th>Pos</th><th>Car</th><th class="l">Team</th><th>Running</th><th>This race</th><th>Total</th><th>Gap</th></tr></thead><tbody>`
    + proj.filter((r, i) => i < 6 || d.tracked.includes(r.car)).map(r => { const run = c.cars.find(x => x.car === r.car);
      return `<tr class="${d.tracked.includes(r.car) ? "tracked" : ""}" style="--c:${colorOf(r.car)}">
        <td>${r.proj_pos}</td><td>#${esc(r.car)}</td><td class="l team">${esc(r.team || run?.vehicle)}</td>
        <td>${run ? "P" + run.class_pos + (run.in_pit ? " · pit" : "") : "–"}</td><td class="dim">+${fmt(r.race_pts + r.quali_pts)}</td>
        <td class="total">${fmt(r.projected)}</td><td class="dim">${r.proj_gap ? "−" + fmt(r.proj_gap) : "—"}</td></tr>`; }).join("")
    + `</tbody></table></div>` : "";

  const m = c.stint_model, st = c.strategy;
  const el = $("live");
  el.classList.toggle("done", !!l.finished);
  el.innerHTML = `<div class="live-head"><span class="pulse">${l.finished ? "FINISHED" : "LIVE"}</span>
      <b>${esc(l.event)}</b> · ${esc(sess)} · ${esc(cls)}
      <span class="flag" style="--f:${FLAG_COLORS[flagKey] || "var(--text-2)"}">${esc(l.flag)}</span>
      ${l.finished ? "" : `<span class="ttg">${esc(left)} to go</span>`}</div>
    <div class="live-verdict">${verdict}</div>
    <p class="live-sub">${sub}</p>
    <div class="runners">${runners}</div>
    <h2 style="margin-top:20px">Lap times</h2>
    <div class="legend" id="lap-legend"></div>
    <div class="chart" id="lapchart"><div class="tip" id="laptip"></div></div>
    <h2 style="margin-top:20px">${esc(cls)} timing</h2>
    ${timing}
    ${projTable}
    <p class="note">${l.finished && l.is_race ? "Provisional until IMSA publishes the official points. " : ""}`
      + `From IMSA live timing, updated ${new Date(l.updated).toLocaleTimeString()}. `
      + (st ? `Pace, trends and pit-now estimates are recalculated every 5 minutes (last ${new Date(st.updated).toLocaleTimeString()})`
        + (st.pit_loss ? `, using ${Math.round(st.pit_loss)}s in the pit lane per stop. ` : ". ") : "")
      + (l.is_race ? (c.quali_counted ? "Includes qualifying points. " : "Qualifying points not included. ") + "Ties and penalties aren't accounted for. " : "")
      + (m && l.is_race ? `Pit windows: full-tank stints of ${m.short}–${m.long} laps (typically ${m.typical}) from ${esc(m.source)}. A yellow or a short fill moves them.` : "")
      + `</p>`;
  drawLaps(d, colorOf);
}

// Lap time chart: the selected car, the other Corvettes in its class, and the class leader.
function drawLaps(d, colorOf) {
  const el = $("lapchart"), cls = laps?.classes?.[d.class];
  if (!el || !cls) return;
  const leader = live.classes[d.class].cars[0]?.car;
  const cars = [...new Set([...d.tracked, leader])].filter(c => cls[c]?.laps?.length);
  if (!cars.length) { el.insertAdjacentHTML("afterbegin", `<p class="note">No laps recorded yet.</p>`); return; }
  const all = cars.flatMap(c => cls[c].laps.map(l => l[1]));
  const best = Math.min(...all), cap = best * 1.07;   // slower laps (pits, yellows) pinned to the top edge
  const W = Math.max(320, el.clientWidth), H = W < 600 ? 200 : 240, m = { t: 10, r: 16, b: 24, l: 48 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const maxLap = Math.max(...cars.flatMap(c => cls[c].laps.map(l => l[0])));
  const x = n => m.l + (maxLap <= 1 ? iw / 2 : ((n - 1) / (maxLap - 1)) * iw);
  const y = t => m.t + ih - ((Math.min(t, cap) - best) / (cap - best)) * ih;
  let g = "";
  for (let i = 0; i <= 4; i++) {
    const t = best + (cap - best) * i / 4;
    g += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(t)}" y2="${y(t)}" stroke="var(--grid)"/><text x="${m.l - 6}" y="${y(t) + 4}" text-anchor="end">${lapTime(t)}</text>`;
  }
  const step = Math.max(1, Math.ceil(maxLap / Math.floor(iw / 50)));
  for (let n = 1; n <= maxLap; n += step) g += `<text x="${x(n)}" y="${H - 6}" text-anchor="middle">${n}</text>`;
  const order = cars.slice().sort((a, b) => (a === d.tracked[0]) - (b === d.tracked[0]));
  let lines = "";
  for (const c of order) {
    const col = c === leader && !d.tracked.includes(c) ? "var(--context)" : colorOf(c);
    const pts = cls[c].laps.map(([n, t]) => `${x(n)},${y(t)}`).join(" ");
    lines += `<polyline fill="none" stroke="${col}" stroke-width="${c === d.tracked[0] ? 2 : 1.25}" stroke-linejoin="round" points="${pts}"/>`;
    for (const s of cls[c].stops) lines += `<line x1="${x(s)}" x2="${x(s)}" y1="${m.t + ih}" y2="${m.t + ih - 6}" stroke="${col}" stroke-width="2"/>`;
  }
  el.querySelector("svg")?.remove();
  el.querySelector("p.note")?.remove();
  el.insertAdjacentHTML("afterbegin", `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Lap times by lap">${g}${lines}<rect id="laphit" x="${m.l}" y="${m.t}" width="${iw}" height="${ih}" fill="transparent"/></svg>`);
  $("lap-legend").innerHTML = cars.map(c => `<span style="--c:${c === leader && !d.tracked.includes(c) ? "var(--context)" : colorOf(c)}">#${esc(c)}${c === leader ? " (class leader)" : ""}</span>`).join("")
    + `<span style="--c:var(--text-3)">Ticks: pit stops · laps over 107% of the best are pinned to the top</span>`;
  const svg = el.querySelector("svg"), tip = $("laptip");
  svg.querySelector("#laphit").addEventListener("pointermove", ev => {
    const r = svg.getBoundingClientRect(), px = (ev.clientX - r.left) * (W / r.width);
    const n = Math.max(1, Math.min(maxLap, Math.round(1 + (px - m.l) / iw * (maxLap - 1))));
    tip.innerHTML = `<b>Lap ${n}</b>` + cars.map(c => { const l = cls[c].laps.find(l => l[0] === n);
      return `<div><span><i style="--c:${colorOf(c)}"></i>#${esc(c)}</span><span>${l ? lapTime(l[1]) : "–"}</span></div>`; }).join("");
    tip.style.display = "block";
    tip.style.left = Math.min(x(n) / W * r.width + 12, r.width - tip.offsetWidth) + "px";
    tip.style.top = "8px";
  });
  svg.querySelector("#laphit").addEventListener("pointerleave", () => { tip.style.display = "none"; });
}

function drawChart(series, done, colorOf) {
  const el = $("chart");
  el.querySelector("svg")?.remove();
  chartWidth = el.clientWidth;
  const W = Math.max(320, el.clientWidth), H = W < 600 ? 240 : 320, m = { t: 12, r: 40, b: 28, l: 40 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const max = Math.max(50, ...series.flatMap(x => x.gap));
  const step = max > 400 ? 100 : max > 200 ? 50 : 25;
  const top = Math.ceil(max / step) * step;
  const x = i => m.l + (done.length === 1 ? iw / 2 : (i / (done.length - 1)) * iw);
  const y = v => m.t + (v / top) * ih;   // 0 behind = top of the chart
  let g = "";
  for (let v = 0; v <= top; v += step)
    g += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)"/>`
      + `<text x="${m.l - 8}" y="${y(v) + 4}" text-anchor="end">${v ? "−" + fmt(v) : "Lead"}</text>`;
  const every = Math.ceil(done.length / Math.floor(iw / 64));
  done.forEach((e, i) => { if (i % every === 0 || i === done.length - 1) g += `<text x="${x(i)}" y="${H - 6}" text-anchor="middle">${esc(e.name.split(" ")[0])}</text>`; });
  let lines = "", labels = "";
  for (const { s, gap } of series) {
    const c = colorOf(s.car), w = s.tracked ? 2.5 : 1.5;
    lines += `<polyline fill="none" stroke="${c}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round" points="${gap.map((v, i) => `${x(i)},${y(v)}`).join(" ")}"/>`;
    if (s.tracked) {
      const lx = x(gap.length - 1), ly = y(gap.at(-1));
      lines += `<circle cx="${lx}" cy="${ly}" r="4" fill="${c}" stroke="var(--surface)" stroke-width="2"/>`;
      labels += `<text class="lbl" x="${lx + 10}" y="${ly + 4}">#${esc(s.car)}</text>`;
    }
  }
  el.insertAdjacentHTML("afterbegin", `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Points behind the championship leader after each round">${g}${lines}${labels}
    <line id="xh" y1="${m.t}" y2="${m.t + ih}" stroke="var(--text-3)" stroke-dasharray="3 3" visibility="hidden"/>
    <rect x="${m.l}" y="${m.t}" width="${iw}" height="${ih}" fill="transparent" id="hit"/></svg>`);

  // Crosshair + tooltip: snap to nearest round, list the tracked cars and the top of the field.
  const svg = el.querySelector("svg"), tip = $("tip"), xh = svg.querySelector("#xh");
  const move = ev => {
    const r = svg.getBoundingClientRect();
    const px = (ev.clientX - r.left) * (W / r.width);
    const i = Math.max(0, Math.min(done.length - 1, Math.round((px - m.l) / iw * (done.length - 1))));
    xh.setAttribute("x1", x(i)); xh.setAttribute("x2", x(i)); xh.setAttribute("visibility", "visible");
    const atRound = [...series].sort((a, b) => b.pts[i] - a.pts[i]);
    const rows = atRound.filter((t, k) => t.s.tracked || k < 3);
    tip.innerHTML = `<b>After ${esc(done[i].name)}</b>` + rows.map(t =>
      `<div><span><i style="--c:${colorOf(t.s.car)}"></i>P${atRound.indexOf(t) + 1} #${esc(t.s.car)}</span><span>${fmt(t.pts[i])}${t.gap[i] ? ` <small>−${fmt(t.gap[i])}</small>` : ""}</span></div>`).join("");
    tip.style.display = "block";
    const left = x(i) / W * r.width;
    tip.style.left = Math.min(left + 12, r.width - tip.offsetWidth) + "px";
    tip.style.top = "8px";
  };
  const hide = () => { tip.style.display = "none"; xh.setAttribute("visibility", "hidden"); };
  const hit = svg.querySelector("#hit");
  hit.addEventListener("pointermove", move);
  hit.addEventListener("pointerleave", hide);
}

load();
</script>
</body>
</html>
