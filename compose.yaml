# Images are built by .github/workflows/images.yml and pulled from GitHub's registry.
# Update: docker compose pull && docker compose up -d
services:
  scraper:
    image: ghcr.io/joe0121/yellowcarpoints-scraper:latest
    restart: unless-stopped
    environment:
      CARS: ${CARS:-}
      RACE_CARS: ${RACE_CARS:-}
      INTERVAL_MINUTES: ${INTERVAL_MINUTES:-30}
    volumes:
      - data:/data
      - status:/status
      # Session recordings and the scraper log, readable on the host for debugging/replay.
      - ./archive:/data/archive

  # Analysis tab: race prediction (after qualifying, then every race hour) and caution history.
  # Same image as the scraper, its own process, so heavy maths never delays live timing.
  analyst:
    image: ghcr.io/joe0121/yellowcarpoints-scraper:latest
    restart: unless-stopped
    command: ["python", "analyst.py"]
    environment:
      ANALYSIS_MINUTES: ${ANALYSIS_MINUTES:-60}
      CACHE_DIR: /cache
    volumes:
      - data:/data
      - analysis-cache:/cache

  # Anonymous profiles (sync code / passkey), saved settings and the guest book. SQLite in the api-db volume.
  api:
    image: ghcr.io/joe0121/yellowcarpoints-api:latest
    restart: unless-stopped
    environment:
      API_SECRET: ${API_SECRET:?set API_SECRET in .env}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set ADMIN_TOKEN in .env}
      RP_ID: ${RP_ID:-yellowcarpoints.win}
      ORIGINS: ${ORIGINS:-https://yellowcarpoints.win,https://www.yellowcarpoints.win}
      TURNSTILE_SITEKEY: ${TURNSTILE_SITEKEY:-}
      TURNSTILE_SECRET: ${TURNSTILE_SECRET:-}
    volumes:
      - api-db:/db

  web:
    image: ghcr.io/joe0121/yellowcarpoints-web:latest
    restart: unless-stopped
    environment:
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set ADMIN_TOKEN in .env}   # added by the local status server only
    volumes:
      - data:/srv/data:ro
      - status:/srv-status/data:ro
    ports:
      - "127.0.0.1:8088:80"     # local preview only; the public route is the tunnel
      - "127.0.0.1:8089:8089"   # status page, this PC only (not in the tunnel's ingress)

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    # --metrics: connection counters for the status page (Docker network only, not published).
    command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 --config /etc/cloudflared/config.yml run
    # Runs as the host user so it can read the credentials file in ~/.cloudflared (mode 600).
    user: "${TUNNEL_UID:-1000}:${TUNNEL_GID:-1000}"
    volumes:
      - ./cloudflared/config.yml:/etc/cloudflared/config.yml:ro
      - ${HOME}/.cloudflared/f199bcbf-ceae-4912-a7d8-d6ac0786cbed.json:/etc/cloudflared/creds.json:ro
    depends_on:
      - web

volumes:
  data:
  status:
  api-db:
  analysis-cache:
